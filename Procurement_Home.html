<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<title>InLC 구매결재 시스템</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ════════════════════════════════════════════════════════════
     InLC 디자인 시스템 — 와인 레드 그라데이션 · 라운드 · Pretendard
     · 브랜드/REQ chrome  = 와인 레드(#83161A) 그라데이션
     · PRC/구매팀 식별     = 딥 블루(#1E5F9E) 그라데이션
     · 상태 배지           = 기존 의미색 유지(검토중 파랑·결재중 주황·최종승인 보라·반려 빨강)
     · 검수(INSP)          = 틸(#0e7d72) 유지
     · 인라인 스타일 호환을 위해 기존 변수명(--accent/--procurement/--warn/--danger/
       --ok 및 -soft, --ink/--ink-soft/--ink-mute, --line/--line-soft, --neutral-soft,
       --panel/--bg)은 이름을 그대로 유지하고 값만 조정
     ════════════════════════════════════════════════════════════ */
  :root {
    /* ── 베이스 ── */
    --bg: #F4F4F4; --panel: #FFFFFF;
    --ink: #1A1A1A; --ink-soft: #3A3A3A; --ink-mute: #8A8A8A;
    --line: #E0E0E0; --line-soft: #ECECEC; --hairline: #D8D8D8;
    --neutral-soft: #F4F4F4;

    /* ── 브랜드(와인 레드) — REQ·기본 chrome ── */
    --brand: #83161A; --brand-soft: #F8EEEE; --brand-deep: #5E0F12;
    --grad-brand: linear-gradient(135deg, #A32B30 0%, #83161A 55%, #6B1115 100%);
    --grad-brand-hover: linear-gradient(135deg, #93191E 0%, #7A1418 55%, #5E0F12 100%);

    /* ── PRC·구매팀(블루) ── */
    --prc: #1E5F9E; --prc-soft: #EAF2FA; --prc-deep: #174B7E;
    --grad-prc: linear-gradient(135deg, #2E78BE 0%, #1E5F9E 55%, #174B7E 100%);
    --grad-prc-hover: linear-gradient(135deg, #246CAE 0%, #1B568E 55%, #144470 100%);

    /* ── 상태 배지 의미색(기존 유지) ── */
    --accent: #1a6fc4; --accent-soft: #e8f1fb;            /* 검토중 */
    --warn: #d97706; --warn-soft: #fef3e2;                /* 결재중·재상신 */
    --ok: #27ae60; --ok-soft: #e8f6ee;
    --danger: #d64541; --danger-soft: #fdecec;            /* 반려 */
    --procurement: #6a3eb5; --procurement-soft: #f0eafa;  /* 최종승인·PRC생성됨 */

    /* ── 라운드 · 그림자 ── */
    --radius-card: 12px; --radius-btn: 9px; --radius-pill: 999px; --radius-badge: 6px;
    --shadow-card: 0 1px 3px rgba(26,26,26,0.05), 0 4px 14px rgba(131,22,26,0.05);
    --shadow-btn: 0 2px 6px rgba(131,22,26,0.28);
    --shadow-btn-prc: 0 2px 6px rgba(30,95,158,0.26);
    --grad-canvas: linear-gradient(180deg, #F7F7F7 0%, #F2F2F2 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--grad-canvas); background-attachment: fixed; color: var(--ink); font-size: 13px; line-height: 1.55; min-height: 100vh; letter-spacing: -0.01em; }

  .app-header { background: linear-gradient(180deg, #FFFFFF 0%, #FCFAFA 100%); border-bottom: 1px solid var(--line); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  /* 로고 박스: 가로형 워드마크(약 5.8:1)에 맞춘 밝은 라운드 박스 */
  .brand-mark { height: 38px; padding: 0 14px; background: linear-gradient(145deg, #FFFFFF 0%, #FAF5F5 100%); border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(131,22,26,0.10); }
  .brand-mark img { height: 18px; width: auto; display: block; }
  .brand-text { font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
  .brand:hover .brand-text { color: var(--brand); }
  .brand-sub { color: var(--ink-mute); font-size: 11.5px; font-weight: 500; }

  .user-chip { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; background: var(--neutral-soft); border-radius: var(--radius-pill); border: 1px solid var(--line); }
  .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--grad-brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
  .user-name { font-weight: 700; font-size: 12.5px; }
  .user-email { color: var(--ink-mute); font-size: 11px; }
  .role-pills { margin-left: 4px; display: flex; gap: 4px; }
  .role-pill { padding: 2px 9px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 700; }
  .role-pill.user { background: var(--grad-brand); color: #fff; }
  .role-pill.proc { background: var(--grad-prc); color: #fff; }
  .role-pill.admin { background: #fff; color: var(--brand); border: 1px solid var(--brand); }

  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 70px); }
  .sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; }
  .nav-section { margin-bottom: 20px; }
  .nav-section-title { color: var(--ink-mute); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; padding: 0 10px 6px; display: flex; align-items: center; gap: 7px; }
  .nav-section-title::before { content: ''; width: 13px; height: 3px; border-radius: 2px; background: var(--grad-brand); flex-shrink: 0; }
  .nav-section-title.proc { color: var(--prc); }
  .nav-section-title.proc::before { background: var(--grad-prc); }
  .nav-section-title.admin { color: var(--brand); }
  .nav-section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: var(--radius-btn); cursor: pointer; color: var(--ink-soft); font-size: 12.5px; font-weight: 500; user-select: none; margin-bottom: 2px; transition: background 0.15s, color 0.15s; }
  .nav-item:hover { background: var(--line-soft); color: var(--ink); }
  .nav-item.active { background: linear-gradient(135deg, #F8EEEE 0%, #F2E2E2 100%); color: var(--brand); font-weight: 700; }
  .nav-section.proc .nav-item.active { background: linear-gradient(135deg, #EAF2FA 0%, #DCEAF6 100%); color: var(--prc); }
  .nav-section.admin .nav-item:hover { background: var(--brand-soft); color: var(--brand); }
  .nav-section.admin .nav-item.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
  /* 카운트 배지: 수량 > 0 → 브랜드 그라데이션 / 0 → 회색 */
  .nav-count { background: var(--grad-brand); color: #fff; font-size: 10px; padding: 1px 7px; border-radius: var(--radius-pill); font-weight: 700; min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
  .nav-count.zero { background: #C9C9C9; }
  /* 결재 메뉴 2단 트리 */
  .nav-item.nav-parent .nav-label { display: flex; align-items: center; gap: 6px; min-width: 0; }
  /* 캐럿은 '▶' 한 글자를 회전시킨다 ('▶'/'▼' 교체는 자간이 달라 라벨이 흔들림) */
  .nav-caret { display: inline-block; width: 9px; flex-shrink: 0; font-size: 9px; color: var(--ink-mute); transition: transform 0.15s; }
  .nav-caret.open { transform: rotate(90deg); }
  .nav-item.active .nav-caret { color: var(--brand); }
  .nav-item.branch-on { color: var(--ink); font-weight: 700; }   /* 자식이 선택된 부모 */
  .nav-item.nav-child { padding-left: 31px; font-size: 12px; }
  .nav-item.nav-child .nav-count { font-size: 9.5px; padding: 1px 6px; min-width: 16px; }
  /* 대기 건이 있는 메뉴 강조 (기존에 클래스만 붙고 규칙이 없던 .urgent를 실제로 동작시킴) */
  .nav-item.urgent .nav-count { box-shadow: 0 0 0 2px rgba(131,22,26,0.14); }

  /* 결재 조회 범위 토글 (관리자 전용) */
  .scope-switch { display: flex; margin-bottom: 14px; }
  .scope-btn { padding: 6px 15px; border: 1px solid var(--line); background: #fff; color: var(--ink-mute); font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .scope-btn:first-child { border-radius: var(--radius-btn) 0 0 var(--radius-btn); }
  .scope-btn:last-child { border-radius: 0 var(--radius-btn) var(--radius-btn) 0; border-left: none; }
  .scope-btn:hover { background: var(--neutral-soft); }
  .scope-btn.on { background: var(--grad-brand); color: #fff; border-color: transparent; }

  .content { padding: 22px 28px; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--hairline); }
  .page-title { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .page-sub { color: var(--ink-mute); font-size: 12px; margin-top: 3px; }
  .btn { padding: 8px 16px; border-radius: var(--radius-btn); border: 1px solid var(--line); background: #fff; color: var(--ink); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: filter 0.15s, background 0.15s; }
  .btn:hover { background: var(--neutral-soft); }
  .btn-primary { background: var(--grad-brand); color: #fff; border: none; box-shadow: var(--shadow-btn); }
  .btn-primary:hover { background: var(--grad-brand-hover); }
  .btn-proc { background: var(--grad-prc); color: #fff; border: none; box-shadow: var(--shadow-btn-prc); }
  .btn-proc:hover { background: var(--grad-prc-hover); }
  .btn:disabled { cursor: not-allowed; opacity: 0.6; }
  .btn:disabled:hover { filter: none; }
  .btn-inline-spin { display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 15px 17px; box-shadow: var(--shadow-card); }
  .kpi-card.highlight { border-color: rgba(131,22,26,0.32); background: linear-gradient(145deg, #FFFFFF 0%, #FBF3F3 60%, #F5E7E7 100%); }
  .kpi-card.kpi-click { cursor: pointer; transition: border-color .12s, box-shadow .12s, transform .08s; }
  .kpi-card.kpi-click:hover { border-color: rgba(131,22,26,0.32); box-shadow: 0 3px 10px rgba(131,22,26,0.10); }
  .kpi-card.kpi-click:active { transform: translateY(1px); }
  .kpi-label { color: var(--ink-mute); font-size: 11px; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
  .kpi-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--grad-brand); flex-shrink: 0; }
  .kpi-value { font-size: 27px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi-card.highlight .kpi-value { color: var(--brand); }
  .kpi-unit { font-size: 12px; color: var(--ink-mute); font-weight: 500; margin-left: 2px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card); margin-bottom: 18px; overflow: hidden; box-shadow: var(--shadow-card); }
  .panel-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; background: linear-gradient(180deg, #FCFCFC, #FAFAFA); }
  .panel-title { font-weight: 700; font-size: 13.5px; }
  .scope-tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: var(--radius-badge); font-size: 10px; font-weight: 700; background: var(--neutral-soft); color: var(--ink-mute); }
  .scope-tag.proc { background: var(--prc-soft); color: var(--prc); }
  .scope-tag.admin { background: #fff; color: var(--brand); border: 1px solid var(--brand); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 9px 16px; color: var(--ink-mute); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: #FAFAFA; border-bottom: 1px solid var(--line); }
  td { padding: 11px 16px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr.row-clickable { cursor: pointer; transition: background 0.12s; }
  tr.row-clickable:hover { background: var(--line-soft); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: 'Consolas', monospace; font-size: 12px; }
  .docno { color: var(--brand); font-weight: 700; }
  .docno.prc { color: var(--prc); }

  /* ── 리스트 헤더 컬럼 필터 (엑셀형 다중 선택) ── */
  th.th-filter { position: relative; padding-right: 32px; }
  .col-filter-btn { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; border-radius: 5px; color: var(--ink-mute); cursor: pointer; transition: background 0.12s, color 0.12s; }
  .col-filter-btn:hover { background: var(--line-soft); color: var(--ink-soft); }
  .col-filter-btn.active { background: var(--brand-soft); color: var(--brand); }
  .col-filter-btn svg { display: block; }
  .col-filter-pop { position: fixed; z-index: 1200; width: 232px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(26,26,26,0.18); padding: 8px; font-size: 12.5px; text-transform: none; letter-spacing: normal; color: var(--ink); font-weight: 500; }
  .cfp-search { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; font-family: inherit; font-size: 12px; margin-bottom: 6px; outline: none; }
  .cfp-search:focus { border-color: var(--brand); }
  .cfp-all { font-weight: 700; border-bottom: 1px solid var(--line-soft); }
  .cfp-list { max-height: 320px; overflow-y: auto; margin: 2px 0; }
  .cfp-item { display: flex; align-items: center; gap: 8px; padding: 6px 7px; border-radius: 6px; cursor: pointer; }
  .cfp-item:hover { background: var(--line-soft); }
  .cfp-item input { width: 14px; height: 14px; accent-color: var(--brand); cursor: pointer; flex-shrink: 0; }
  .cfp-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cfp-empty { padding: 10px 7px; color: var(--ink-mute); font-size: 12px; }
  .cfp-foot { display: flex; gap: 6px; padding-top: 7px; border-top: 1px solid var(--line-soft); margin-top: 4px; }
  .cfp-foot button { flex: 1; padding: 6px 0; border-radius: 7px; border: 1px solid var(--line); background: #fff; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .cfp-foot .cfp-close { background: var(--grad-brand); color: #fff; border: none; }
  .cfp-foot button:hover { filter: brightness(0.97); }

  /* ── 상태 배지: 기존 디자인 그대로 유지 ── */
  .status { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10.5px; font-weight: 700; }
  .status.review     { background: var(--accent-soft); color: var(--accent); }
  .status.in_appr    { background: var(--warn-soft); color: var(--warn); }
  .status.approved   { background: var(--ok-soft); color: var(--ok); }
  .status.rejected   { background: var(--danger-soft); color: var(--danger); }
  .status.resubmit   { background: var(--warn-soft); color: var(--warn); }
  .status.final      { background: #ede7f6; color: #6a3eb5; }
  .status.prc_made   { background: var(--procurement-soft); color: var(--procurement); }
  .status.unknown    { background: var(--neutral-soft); color: var(--ink-mute); }

  /* 반려 배지 옆 후속 처리 버튼 — 본인 기안 반려 건에만 노출 */
  .reject-act-btn { margin-left: 6px; padding: 2px 8px; border: 1px solid var(--danger); border-radius: 3px; background: var(--danger); color: #fff; font-family: inherit; font-size: 10.5px; font-weight: 700; line-height: 1.45; cursor: pointer; vertical-align: middle; white-space: nowrap; }
  .reject-act-btn:hover { background: #fff; color: var(--danger); }

  .empty { padding: 40px 20px; text-align: center; color: var(--ink-mute); }
  .empty-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.5; }

  /* ── 페이지네이션 ── */
  .pager:empty { display: none; }
  .pager { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); background: linear-gradient(180deg, #FCFCFC, #FAFAFA); flex-wrap: wrap; }
  .pager-info { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ink-mute); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pager-btns { display: flex; align-items: center; gap: 4px; }
  .pager-btn { min-width: 30px; height: 28px; padding: 0 9px; border: 1px solid var(--line); background: #fff; color: var(--ink-soft); border-radius: 7px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; transition: background 0.12s, color 0.12s, border-color 0.12s; }
  .pager-btn:hover:not(:disabled):not(.active) { background: var(--line-soft); color: var(--ink); }
  .pager-btn.active { background: var(--grad-brand); color: #fff; border-color: transparent; cursor: default; }
  .pager-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager-gap { color: var(--ink-mute); font-size: 12px; padding: 0 2px; user-select: none; }

  .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border-radius: var(--radius-btn); font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.ok { background: var(--ok); color: #fff; }
  .toast.err { background: var(--danger); color: #fff; }
  .toast.info { background: var(--ink); color: #fff; }

  /* ─── PRC 픽업 모달 ─────────────────────────────────── */
  .pkmodal-backdrop { position: fixed; inset: 0; background: rgba(26,26,26,0.55); display: flex; align-items: center; justify-content: center; z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  .pkmodal-backdrop.show { opacity: 1; pointer-events: auto; }
  .pkmodal { background: var(--panel); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); width: 440px; max-width: calc(100vw - 32px); overflow: hidden; transform: translateY(8px) scale(0.98); transition: transform 0.2s ease; }
  .pkmodal-backdrop.show .pkmodal { transform: translateY(0) scale(1); }
  .pkmodal-header { padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
  .pkmodal-title { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0; }
  .pkmodal-body { padding: 22px; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .pkmodal-footer { padding: 12px 22px 18px; display: flex; justify-content: flex-end; gap: 8px; min-height: 32px; }
  .pkmodal-footer.empty { padding: 0; min-height: 0; }
  .pkmodal-message { font-size: 13.5px; font-weight: 600; text-align: center; margin: 0; color: var(--ink); }
  .pkmodal-message.ok { color: var(--ok); }
  .pkmodal-message.err { color: var(--danger); }
  .pkmodal-detail { font-size: 12px; color: var(--ink-mute); text-align: center; margin: 0; line-height: 1.6; }
  .pkmodal-detail-row { display: flex; align-items: center; gap: 6px; justify-content: center; }

  .pkmodal-spinner { width: 42px; height: 42px; border: 3px solid var(--line); border-top-color: var(--prc); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .pkmodal-spinner.sm { width: 14px; height: 14px; border-width: 2px; }

  .pkmodal-success { width: 46px; height: 46px; border-radius: 50%; background: var(--ok); display: flex; align-items: center; justify-content: center; animation: pkpop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .pkmodal-success svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: pkdraw 0.4s 0.2s ease forwards; }
  .pkmodal-error { width: 46px; height: 46px; border-radius: 50%; background: var(--danger); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; animation: pkpop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); font-family: inherit; line-height: 1; }
  .pkmodal-confirm { width: 46px; height: 46px; border-radius: 50%; background: var(--prc-soft); color: var(--prc); display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1; animation: pkpop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pkpop { 0% { transform: scale(0); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes pkdraw { to { stroke-dashoffset: 0; } }

  .pkmodal-steps { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .pkmodal-step { display: flex; align-items: center; gap: 9px; padding: 7px 11px; background: var(--line-soft); border-radius: var(--radius-btn); font-size: 11.5px; color: var(--ink-mute); transition: all 0.3s ease; }
  .pkmodal-step.active { background: var(--prc-soft); color: var(--prc); font-weight: 600; }
  .pkmodal-step.done { background: var(--ok-soft); color: var(--ok); }
  .pkmodal-step-dot { width: 14px; height: 14px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; position: relative; transition: background 0.3s ease; }
  .pkmodal-step.active .pkmodal-step-dot { background: var(--prc); }
  .pkmodal-step.active .pkmodal-step-dot::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--prc); opacity: 0.4; animation: pkpulse 1.2s ease-in-out infinite; }
  .pkmodal-step.done .pkmodal-step-dot { background: var(--ok); }
  .pkmodal-step.done .pkmodal-step-dot::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 700; }
  @keyframes pkpulse { 0%,100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.25); opacity: 0; } }

  .pkmodal-info { width: 100%; background: var(--line-soft); border: 1px solid var(--line); border-radius: var(--radius-btn); padding: 10px 12px; font-size: 11.5px; }
  .pkmodal-info-row { display: flex; justify-content: space-between; padding: 2px 0; gap: 12px; }
  .pkmodal-info-row .lbl { color: var(--ink-mute); }
  .pkmodal-info-row .val { font-weight: 600; color: var(--ink); text-align: right; word-break: break-all; }

  .pkmodal-btn { padding: 8px 15px; border-radius: var(--radius-btn); font-size: 12.5px; font-weight: 700; cursor: pointer; border: 1px solid transparent; font-family: inherit; transition: all 0.15s; }
  .pkmodal-btn.primary { background: var(--grad-prc); color: #fff; border: none; box-shadow: var(--shadow-btn-prc); }
  .pkmodal-btn.primary:hover { background: var(--grad-prc-hover); }
  .pkmodal-btn.secondary { background: var(--panel); color: var(--ink-soft); border-color: var(--line); }
  .pkmodal-btn.secondary:hover { background: var(--line-soft); }

  .claim-info { font-size: 11px; color: var(--prc); font-weight: 600; }
  .claim-info.other { color: var(--warn); }
  .pickup-btn { background: var(--grad-prc); color: #fff; border: none; padding: 6px 13px; border-radius: var(--radius-btn); font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--shadow-btn-prc); }
  .pickup-btn:hover { background: var(--grad-prc-hover); }
  .pickup-btn:disabled { background: #aaa; cursor: not-allowed; box-shadow: none; }

  .role-empty-state { padding: 60px 24px; text-align: center; color: var(--ink-mute); }
  .role-empty-state h3 { font-size: 16px; color: var(--ink); margin-bottom: 6px; font-weight: 700; }
  /* ─── [INSP Step 2] 결재 완료 / 검수보고서 아코디언 (틸 계열 유지) ─── */
  .status.insp-none { background: #f0f2f5; color: #4a5260; }
  .status.insp-closed { background: #0e7d72; color: #fff; }
  tr.po-row { cursor: pointer; }
  tr.po-row:hover td { background: #fafbfc; }
  .chev { display: inline-block; transition: transform .15s; color: var(--ink-mute); font-size: 10px; margin-right: 6px; }
  tr.po-row.open .chev { transform: rotate(90deg); }
  .po-link { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(0,0,0,.25); }
  .po-link:hover { text-decoration-color: currentColor; }
  tr.insp-sub td { background: #e4f4f2; border-bottom: 1px solid #d4e9e6; padding: 0; }
  .insp-sub-box { padding: 10px 16px 12px 36px; }
  .insp-sub-table { width: 100%; border-collapse: collapse; }
  .insp-sub-table th { background: transparent; border-bottom: 1px solid #c8e2de; color: #0e7d72; font-size: 10.5px; padding: 5px 10px; text-align: left; }
  .insp-sub-table td { background: transparent; border-bottom: 1px solid #d9ece9; padding: 7px 10px; font-size: 12px; }
  .insp-sub-table tr:last-child td { border-bottom: none; }
  .docno.ir { color: #0e7d72; }
  .final-flag { color: #0e7d72; font-weight: 700; font-size: 11px; }
  .btn-insp { background: #0e7d72; color: #fff; border: none; border-radius: var(--radius-btn); padding: 6px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-insp:hover { filter: brightness(1.08); }
  .btn-insp.pending-feature { background: #aab4be; }
</style>
</head>

<script>
var WEBAPP_URL = '<?= webappUrl ?>';
// 메일 링크 등에서 전달된 기본 선택 메뉴 키 (예: ?action=home&menu=completed)
var INITIAL_MENU = '<?= initialMenu ?>';
var STATE = {
  user: null,
  data: null,
  currentMenu: 'mydocs',
  filters: {},   // 메뉴별 KPI 카드 필터 선택 상태 (menuKey → segmentKey). 미설정 시 'all'
  colFilters: {},   // 메뉴별 리스트 헤더 컬럼 필터 (menuKey → { 컬럼index → [허용값,...] }). 미설정 시 전체
  loading: false,
  openCompleted: {},   // [INSP Step 2] 결재 완료 아코디언 열림 상태 (prcToken → bool)
  page: {},   // 메뉴별 현재 페이지 (menuKey → 1-based). 필터/메뉴 변경 시 1로 리셋
  navOpen: {},         // [결재 메뉴 세분화] 결재 트리 부모 펼침 상태 (parentKey → bool)
  apprScope: 'mine',   // [결재 메뉴 세분화] 결재 조회 범위: 'mine' | 'all' (관리자 전용)
};

// 리스트 페이지당 최대 표시 항목 수 (관리자 메뉴 제외 — home에서 처리되는 모든 리스트 공통)
var PAGE_SIZE = 20;

// ─── [결재 메뉴 세분화] 결재 트리 정의 ─────────────────────────────
// 사이드바 / 페이지 / 딥링크 화이트리스트가 전부 여기서 파생된다.
// 메뉴 키 문자열을 두 곳 이상에 쓰지 말 것.
var APPROVAL_TREE = [
  { key:'pending_req',  label:'품의 결재 대기',       src:'req',  docType:'REQ',
    title:'품의 결재 대기',       panelTitle:'결재 대기 중인 품의',
    sub:'내가 다음에 결재해야 할 구매품의서입니다.' },
  { key:'pending_prc',  label:'구매 결재 대기',       src:'req',  docType:'PRC',
    title:'구매 결재 대기',       panelTitle:'결재 대기 중인 구매 문서',
    sub:'내가 다음에 결재해야 할 구매 문서입니다.' },
  { key:'pending_insp', label:'검수보고서 결재 대기', src:'insp',
    title:'검수보고서 결재 대기', panelTitle:'검수 결재 대기',
    sub:'내가 다음에 결재해야 할 검수보고서입니다. 행을 클릭하면 본문·사진을 확인하고 결재할 수 있습니다.' },
];
// 자식 메뉴 = 부모의 KPI 세그먼트. 자식 메뉴키 = 부모키 + '_' + 세그먼트키
//   drafter  : 내 결재 단계가 0 (결재선 블록 0 = 기안자 자기결재)
//   approver : 내 결재 단계가 1 이상 (남이 나에게 요청한 결재)
var APPROVAL_SEGS = [
  { key:'all',      label:'전체' },
  { key:'drafter',  label:'기안자 결재' },
  { key:'approver', label:'결재자 결재' },
];
// 구 메뉴 키 호환 — 과거 북마크/방문기록의 ?menu= 값을 신규 키로 변환
var MENU_ALIAS = { pending: 'pending_req', insp_pending: 'pending_insp' };

// 메뉴 키(부모/자식 무관) → 트리 노드. 결재 메뉴가 아니면 null
function apprNodeFor(key){
  var base = String(key || '').replace(/_(drafter|approver)$/, '');
  for(var i = 0; i < APPROVAL_TREE.length; i++){
    if(APPROVAL_TREE[i].key === base) return APPROVAL_TREE[i];
  }
  return null;
}
function isApprMenu(key){ return !!apprNodeFor(key); }
function isApprChild(key){ return /_(drafter|approver)$/.test(String(key || '')) && isApprMenu(key); }
function apprChildSeg(key){
  var m = String(key || '').match(/_(drafter|approver)$/);
  return m ? m[1] : 'all';
}
// 필터/페이지/컬럼필터의 정규 키 — 자식 메뉴는 부모의 페이지 상태를 그대로 공유한다.
// (자식 키는 '라우트'일 뿐이고 렌더되는 페이지는 부모 페이지 + 카드 선택 상태)
function pageKeyFor(menu){
  var n = apprNodeFor(menu);
  return n ? n.key : menu;
}
// 결재 메뉴 키 전체 (부모 3 + 자식 6 = 9개) — 딥링크 화이트리스트용
function apprAllMenuKeys(){
  var out = [];
  APPROVAL_TREE.forEach(function(n){
    out.push(n.key, n.key + '_drafter', n.key + '_approver');
  });
  return out;
}

// ─── [결재 메뉴 세분화] 카운트 파생 ─────────────────────────────
// 사이드바 배지와 페이지 KPI 카드가 이 체인을 공유한다.
// 덕분에 관리자 범위 토글이 배지 숫자까지 한 번에 바꾼다(요구사항 9).
function canUseApprScope(){ return !!(STATE.user || {}).isAdmin; }
// ⚠ 관리자 확인은 토글 노출 여부가 아니라 여기에 둔다.
//   STATE가 어떤 이유로든 'all'이 되어도 비관리자는 'mine'으로 안전하게 퇴화한다.
function apprScopeIsAll(){ return STATE.apprScope === 'all' && canUseApprScope(); }

// 현재 범위에 해당하는 원본 배열
function apprSourceRows(src){
  var d = STATE.data || {};
  if(src === 'insp') return (apprScopeIsAll() ? d.allInspPending : d.myInspPending) || [];
  return (apprScopeIsAll() ? d.allPending : d.myPending) || [];
}

// 부모 노드의 전체 행 (문서 종류 분기 포함, 최신순)
function apprParentRows(node){
  var rows = sortByNewest(apprSourceRows(node.src));
  if(node.docType){
    rows = rows.filter(function(x){ return x.docType === node.docType; });
  }
  return rows;
}

// 부모 노드 → [전체, 기안자 결재, 결재자 결재]
// 분류는 stageKind 문자열이 아니라 숫자 stageIdx로 판정한다.
// 구버전 서버 응답(stageIdx 없음)은 -1로 떨어져 전체에만 잡히고 자식 배지를 부풀리지 않는다.
function apprSegments(node){
  var rows = apprParentRows(node);
  function stage(x){ return (typeof x.stageIdx === 'number') ? x.stageIdx : -1; }
  return [
    { key:'all',      label:APPROVAL_SEGS[0].label, rows: rows },
    { key:'drafter',  label:APPROVAL_SEGS[1].label, rows: rows.filter(function(x){ return stage(x) === 0; }) },
    { key:'approver', label:APPROVAL_SEGS[2].label, rows: rows.filter(function(x){ return stage(x) >= 1; }) },
  ];
}

// [INSP Step 2] 검수보고서 작성 화면 활성 여부 — Step 3 배포 시 true로 변경
var INSP_FORM_ENABLED = true;   // [INSP Step 3] 작성 화면 활성화

// ─── 부팅 ─────────────────────────────
function boot(){
  // 메일 링크로 전달된 기본 메뉴가 유효하면 초기 선택 메뉴로 적용
  var ALLOWED_INITIAL_MENUS = ['mydocs','completed','final','inbox','myprc'].concat(apprAllMenuKeys());
  // 구 키(pending / insp_pending)를 신규 키로 먼저 치환 → 화이트리스트에는 정식 키만 등재
  var menu = MENU_ALIAS[INITIAL_MENU] || INITIAL_MENU;
  if(menu && ALLOWED_INITIAL_MENUS.indexOf(menu) >= 0){
    STATE.currentMenu = menu;
    var node = apprNodeFor(menu);
    if(node){
      // 결재 메뉴로 진입하면 해당 부모를 펼치고 대응 카드를 선택한 상태로 시작
      STATE.navOpen[node.key] = true;
      STATE.filters[node.key] = isApprChild(menu) ? apprChildSeg(menu) : 'all';
    }
  }
  loadHome();
}

function loadHome(){
  // 연타 방지: 이미 로딩 중이면 새 호출을 발사하지 않음
  if(STATE.loading) return;
  STATE.loading = true;
  setRefreshButtonsLoading(true);
  if(typeof google === 'undefined'){
    STATE.loading = false;
    setRefreshButtonsLoading(false);
    showError('Google Apps Script 환경에서만 실행 가능합니다.');
    return;
  }
  google.script.run
    .withSuccessHandler(function(res){
      STATE.loading = false;
      setRefreshButtonsLoading(false);
      if(!res || !res.ok){
        showError('데이터 로드 실패: ' + (res ? res.message : '응답이 비어있습니다.'));
        return;
      }
      STATE.data = res;
      STATE.user = res.user;
      renderUser();
      renderSidebar();
      renderContent();
    })
    .withFailureHandler(function(err){
      STATE.loading = false;
      setRefreshButtonsLoading(false);
      showError('네트워크 오류: ' + (err && err.message ? err.message : err));
    })
    .getHomeDataForClient();
}

// 새로고침/다시시도 버튼들의 로딩 상태를 토글
// (loadHome을 호출하는 모든 버튼에 적용 — 동적으로 렌더되므로 호출 시점에 탐색)
function setRefreshButtonsLoading(isLoading){
  var btns = document.querySelectorAll('button[onclick="loadHome()"]');
  Array.prototype.forEach.call(btns, function(btn){
    if(isLoading){
      // 원래 라벨 보존 (최초 1회만)
      if(!btn.hasAttribute('data-label')){
        btn.setAttribute('data-label', btn.textContent);
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-inline-spin"></span>' + btn.getAttribute('data-label');
    } else {
      btn.disabled = false;
      if(btn.hasAttribute('data-label')){
        btn.textContent = btn.getAttribute('data-label');
      }
    }
  });
}

// ─── 사용자 표시 ─────────────────────────────
function renderUser(){
  var u = STATE.user || {};
  var email = u.email || '(미인증)';
  var initial = (email[0] || '?').toUpperCase();
  document.getElementById('user-avatar').textContent = initial;
  document.getElementById('user-name').textContent = email.split('@')[0] || email;
  document.getElementById('user-email').textContent = email;

  // 결재자 목록 시트의 부서 열(getDeptByEmailMap) 기준 부서명을 표시. 미매칭 시 '사용자' 폴백
  var deptLabel = (u.dept && String(u.dept).trim()) ? escHtml(u.dept) : '사용자';
  var pills = '<span class="role-pill user">' + deptLabel + '</span>';
  if(u.isProcurement) pills += '<span class="role-pill proc">구매팀</span>';
  if(u.isAdmin) pills += '<span class="role-pill admin">관리자</span>';
  document.getElementById('user-roles').innerHTML = pills;
}

// ─── 사이드바 ─────────────────────────────
function renderSidebar(){
  var d = STATE.data || {};
  var u = STATE.user || {};

  // [메뉴 재편] 기본 / 결재 / 조회 3그룹
  var basicMenu = [
    { key: 'mydocs',    label: '기안 문서', count: (d.myDocs || []).length },
    { key: 'completed', label: '결재 완료 + 검수보고서 제출', count: (d.completedDocs || []).length },   // [INSP Step 2/5]
  ];
  var lookupMenu = [
    { key: 'final', label: '최종 완료 문서 조회', count: (d.finalDocs || []).length },   // [INSP Step 5]
  ];
  var proc = u.isProcurement ? [
    { key: 'inbox',  label: '구매팀 기안 문서', count: (d.approvedInbox || []).length, urgent: (d.approvedInbox || []).length > 0 },
    { key: 'myprc',  label: '진행 중 구매', count: (d.myPrc || []).length },
  ] : [];

  var html = '';
  // ── 기본 메뉴 ──
  html += '<div class="nav-section">';
  html += '<div class="nav-section-title">기본 메뉴</div>';
  basicMenu.forEach(function(m){ html += renderNavItem(m); });
  html += '<div class="nav-item" data-menu="new" style="background:var(--grad-brand);color:#fff;margin-top:8px;font-weight:700;justify-content:center;box-shadow:var(--shadow-btn);">+ 신규 작성</div>';
  html += '</div>';

  // ── 결재 메뉴 (2단 트리) ──
  // 부모: 문서 종류(품의/구매/검수보고서) · 자식: 결재 성격(기안자/결재자)
  html += '<div class="nav-section">';
  html += '<div class="nav-section-title">결재 메뉴</div>';
  APPROVAL_TREE.forEach(function(node){
    var segs = apprSegments(node);
    var open = !!STATE.navOpen[node.key];
    html += renderNavParent(node, segs[0].rows.length, open);
    if(open){
      html += renderNavChild(node.key + '_drafter',  segs[1].label, segs[1].rows.length);
      html += renderNavChild(node.key + '_approver', segs[2].label, segs[2].rows.length);
    }
  });
  html += '</div>';

  // ── 조회 메뉴 ──
  html += '<div class="nav-section">';
  html += '<div class="nav-section-title">조회 메뉴</div>';
  lookupMenu.forEach(function(m){ html += renderNavItem(m); });
  html += '</div>';

  if(proc.length > 0){
    html += '<div class="nav-section proc">';
    html += '<div class="nav-section-title proc">구매팀 메뉴</div>';
    proc.forEach(function(m){ html += renderNavItem(m); });
    html += '</div>';
  }

  // 관리자 메뉴 (isAdmin === true일 때만 표시)
  if(u.isAdmin){
    html += '<div class="nav-section admin">';
    html += '<div class="nav-section-title admin">⚙ 관리자 메뉴</div>';
    html += '<div class="nav-item" data-menu="admin_discard">'
         +    '<span>강제 폐기</span>'
         + '</div>';
    html += '<div class="nav-item" data-menu="admin_force_release_lock">'
         +    '<span>강제 락 해제</span>'
         + '</div>';
    // 향후 추가 자리:
    // <div class="nav-item disabled"><span>대리 결재</span><span class="nav-soon">SOON</span></div>
    // <div class="nav-item disabled"><span>결재자 변경</span><span class="nav-soon">SOON</span></div>
    // <div class="nav-item disabled"><span>상태 강제 변경</span><span class="nav-soon">SOON</span></div>
    html += '</div>';
  }

  var bar = document.getElementById('sidebar');
  bar.innerHTML = html;
  Array.from(bar.querySelectorAll('.nav-item')).forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-menu');
      if(key === 'new'){
        // 신규 작성 — ?action=new로 이동
        window.top.location.href = WEBAPP_URL + '?action=new';
        return;
      }
      if(key === 'admin_discard'){
        // 관리자 강제 폐기 — ?action=admin&fn=discard로 이동
        window.top.location.href = WEBAPP_URL + '?action=admin&fn=discard';
        return;
      }
      if(key === 'admin_force_release_lock'){
        // 관리자 강제 락 해제 — ?action=admin&fn=force_release_lock로 이동
        window.top.location.href = WEBAPP_URL + '?action=admin&fn=force_release_lock';
        return;
      }
      // [결재 메뉴 세분화] 결재 트리: 펼침 토글 + 목록 이동을 함께 처리
      if(isApprMenu(key)){
        var node = apprNodeFor(key);
        if(isApprChild(key)){
          STATE.navOpen[node.key] = true;              // 자식 선택 시 부모는 항상 펼친 상태 유지
          STATE.filters[node.key] = apprChildSeg(key);
        } else {
          // 부모: 이미 펼쳐져 있고 현재 보고 있는 메뉴면 접기, 그 외에는 펼치기 + 전체 목록
          var collapse = (STATE.navOpen[node.key] && STATE.currentMenu === node.key);
          STATE.navOpen[node.key] = !collapse;
          STATE.filters[node.key] = 'all';
        }
        STATE.page[node.key] = 1;   // 필터가 바뀌므로 첫 페이지로
        showMenu(key);
        return;
      }
      showMenu(key);
    });
  });
}

function renderNavItem(m){
  return '<div class="nav-item ' + (STATE.currentMenu === m.key ? 'active' : '') + ' ' + (m.urgent ? 'urgent' : '') + '" data-menu="' + m.key + '">'
    + '<span>' + escHtml(m.label) + '</span>'
    + '<span class="nav-count' + (m.count > 0 ? '' : ' zero') + '">' + m.count + '</span>'
    + '</div>';
}

// [결재 메뉴 세분화] 트리 부모 행 — 캐럿 + 라벨 + 배지
//   캐럿은 '▶' 한 글자를 CSS로 회전시킨다. '▶'/'▼' 글자 교체는 자간이 달라
//   토글할 때마다 라벨이 좌우로 흔들린다.
function renderNavParent(node, count, open){
  var selected = (STATE.currentMenu === node.key);
  var childOn  = isApprChild(STATE.currentMenu) && apprNodeFor(STATE.currentMenu) === node;
  return '<div class="nav-item nav-parent' + (selected ? ' active' : '') + (childOn ? ' branch-on' : '')
       + (count > 0 ? ' urgent' : '') + '" data-menu="' + node.key + '">'
    + '<span class="nav-label"><span class="nav-caret' + (open ? ' open' : '') + '">▶</span>'
    + escHtml(node.label) + '</span>'
    + '<span class="nav-count' + (count > 0 ? '' : ' zero') + '">' + count + '</span>'
    + '</div>';
}

// [결재 메뉴 세분화] 트리 자식 행 — 배지 처리는 부모/기존 메뉴와 동일 규칙
function renderNavChild(key, label, count){
  return '<div class="nav-item nav-child' + (STATE.currentMenu === key ? ' active' : '')
       + '" data-menu="' + key + '">'
    + '<span>' + escHtml(label) + '</span>'
    + '<span class="nav-count' + (count > 0 ? '' : ' zero') + '">' + count + '</span>'
    + '</div>';
}

function showMenu(key){
  STATE.currentMenu = key;
  renderSidebar();
  renderContent();
}

// ─── 콘텐츠 ─────────────────────────────
function renderContent(){
  var key = STATE.currentMenu;
  var apprNode = apprNodeFor(key);   // [결재 메뉴 세분화] 부모/자식 모두 같은 페이지 렌더러로
  var html;
  if(apprNode) html = renderApprPage(apprNode);
  else if(key === 'mydocs')  html = renderMyDocs();
  else if(key === 'inbox')   html = renderInbox();
  else if(key === 'myprc')   html = renderMyPrc();
  else if(key === 'completed') html = renderCompleted();   // [INSP Step 2]
  else if(key === 'final') html = renderFinal();                // [INSP Step 5]
  else html = '<div class="empty">알 수 없는 메뉴입니다.</div>';
  document.getElementById('content').innerHTML = html;
  attachContentHandlers();
}

function attachContentHandlers(){
  // [결재 메뉴 세분화] 관리자 조회 범위 토글 (내 결재만 / 전체)
  Array.from(document.querySelectorAll('[data-appr-scope]')).forEach(function(el){
    el.addEventListener('click', function(){
      var v = el.getAttribute('data-appr-scope');
      if(!canUseApprScope() || STATE.apprScope === v) return;
      STATE.apprScope = v;
      // 행 집합과 컬럼 구성('현재 결재자' 열 유무)이 모두 바뀐다.
      // ⚠ colFilters는 컬럼 '인덱스'로 키를 잡으므로, 열이 삽입되면 저장된 필터가
      //   엉뚱한 컬럼에 걸린다. 반드시 초기화할 것.
      APPROVAL_TREE.forEach(function(n){
        STATE.page[n.key] = 1;
        delete STATE.colFilters[n.key];
      });
      renderSidebar();   // 사이드바 배지 숫자도 선택 범위 기준으로 전환
      renderContent();
    });
  });
  // KPI 카드 필터 (모든 메뉴 통일) — 카드를 누르면 현재 메뉴의 필터가 바뀜
  Array.from(document.querySelectorAll('[data-kpi]')).forEach(function(el){
    el.addEventListener('click', function(){
      var pk  = pageKeyFor(STATE.currentMenu);   // 자식 메뉴여도 부모 키로 정규화
      var seg = el.getAttribute('data-kpi');
      STATE.filters[pk] = seg;
      STATE.page[pk] = 1;   // 필터 변경 → 첫 페이지로
      // [결재 메뉴 세분화] 카드 선택을 사이드바 트리 선택에도 반영 (양방향 동기화)
      if(isApprMenu(pk)){
        STATE.currentMenu = (seg === 'all') ? pk : (pk + '_' + seg);
        STATE.navOpen[pk] = true;
        renderSidebar();
      }
      renderContent();
    });
  });
  // 픽업 버튼
  Array.from(document.querySelectorAll('[data-pickup]')).forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      pickupReq(el.getAttribute('data-pickup'));
    });
  });
  // 행 클릭 → 뷰어 (REQ/PRC)
  Array.from(document.querySelectorAll('[data-view-token]')).forEach(function(el){
    el.addEventListener('click', function(){
      var token = el.getAttribute('data-view-token');
      var docNo = el.getAttribute('data-docno') || '';
      window.top.location.href = WEBAPP_URL + '?action=view&token=' + encodeURIComponent(token) + '&docNo=' + encodeURIComponent(docNo);
    });
  });
  // 반려 건 재상신/폐기 버튼 → 반려 처리 화면 (행 클릭의 뷰어 이동을 막아야 함)
  Array.from(document.querySelectorAll('[data-reject-token]')).forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      var token = el.getAttribute('data-reject-token');
      var docNo = el.getAttribute('data-reject-docno') || '';
      window.top.location.href = WEBAPP_URL + '?action=reject_view&token=' + encodeURIComponent(token) + '&docNo=' + encodeURIComponent(docNo);
    });
  });
  // [INSP Step 5] 행 클릭 → 검수보고서 전용 뷰어
  Array.from(document.querySelectorAll('[data-insp-view]')).forEach(function(el){
    el.addEventListener('click', function(){
      var token = el.getAttribute('data-insp-view');
      window.top.location.href = WEBAPP_URL + '?action=insp_view&token=' + encodeURIComponent(token);
    });
  });
  // PRC 재진입 버튼
  Array.from(document.querySelectorAll('[data-prc-resume]')).forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      var parentToken = el.getAttribute('data-prc-resume');
      window.top.location.href = WEBAPP_URL + '?action=prc&parentId=' + encodeURIComponent(parentToken);
    });
  });
  // [INSP Step 2] 결재 완료 — PO 번호 클릭 시 결재 완료된 구매(PRC) 문서 뷰어
  Array.from(document.querySelectorAll('[data-po-view]')).forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      var token = el.getAttribute('data-po-view');
      var docNo = el.getAttribute('data-po-docno') || '';
      window.top.location.href = WEBAPP_URL + '?action=view&token=' + encodeURIComponent(token) + '&docNo=' + encodeURIComponent(docNo);
    });
  });
  // [INSP Step 2] 결재 완료 — 행 클릭 시 검수 이력 아코디언 토글
  Array.from(document.querySelectorAll('[data-toggle-insp]')).forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-toggle-insp');
      STATE.openCompleted[key] = !STATE.openCompleted[key];
      renderContent();
    });
  });
  // [INSP Step 2] 검수보고서 제출/재상신 버튼
  Array.from(document.querySelectorAll('[data-insp-form]')).forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(!INSP_FORM_ENABLED){
        toast('info', '검수보고서 작성 기능은 다음 업데이트에서 활성화됩니다.');
        return;
      }
      var prcToken = el.getAttribute('data-insp-form');
      var resub = el.getAttribute('data-insp-resub') || '';
      window.top.location.href = WEBAPP_URL + '?action=insp_form&token=' + encodeURIComponent(prcToken)
        + (resub ? '&resub=' + encodeURIComponent(resub) : '');
    });
  });
  // 리스트 헤더 컬럼 필터 (엑셀형 다중 선택)
  attachColumnFilters();
}

// ─── 리스트 헤더 컬럼 필터 (엑셀형 다중 선택) ─────────────────────────────
// home에서 렌더되는 모든 리스트 테이블의 각 헤더에 체크박스 다중 선택 필터를 부착한다.
// 관리자 메뉴는 다른 html로 이동하므로 #content에 테이블이 없어 자동으로 제외된다.
var COL_FILTER_ICON = '<svg width="11" height="11" viewBox="0 0 16 16"><path d="M1.5 2.5h13L9.5 9v4.4l-3 1.2V9z" fill="currentColor"/></svg>';
var COL_FILTER_STATE = null;        // 현재 열린 팝업 정보 ({ btn, table, menuKey, ci })
var COL_FILTER_DOC_HANDLER = null;  // 외부 클릭 감지 핸들러

function attachColumnFilters(){
  closeColFilterPop();
  var content = document.getElementById('content');
  if(!content) return;
  // ⚠ 반드시 부모 키로 정규화. 결재 자식 메뉴(pending_req_drafter 등)는 부모 페이지를
  //   렌더하므로 페이저 컨테이너 id도 부모 키(pager-pending_req)다.
  //   currentMenu를 그대로 쓰면 renderPager가 DOM을 못 찾고 페이지네이션이 사라진다.
  var menuKey = pageKeyFor(STATE.currentMenu);
  Array.from(content.querySelectorAll('table')).forEach(function(table){
    if(table.classList.contains('insp-sub-table')) return;   // 아코디언 하위 표는 제외
    if(!table.tHead || !table.tHead.rows.length) return;
    Array.from(table.tHead.rows[0].cells).forEach(function(th, ci){
      var label = th.textContent.trim();
      if(!label) return;   // 액션/빈 헤더에는 필터 미부착
      th.classList.add('th-filter');
      var btn = document.createElement('span');
      btn.className = 'col-filter-btn';
      btn.innerHTML = COL_FILTER_ICON;
      if(getColFilter(menuKey, ci)) btn.classList.add('active');
      btn.addEventListener('click', function(ev){
        ev.stopPropagation();
        openColFilterPop(table, menuKey, ci, btn);
      });
      th.appendChild(btn);
    });
    applyColumnFilters(table, menuKey);   // 저장된 필터 재적용 (재렌더 후에도 유지)
  });
}

// menuKey/컬럼별 허용값 배열 조회 (null = 필터 없음 = 전체 표시)
function getColFilter(menuKey, ci){
  var m = STATE.colFilters[menuKey];
  return (m && m[ci]) ? m[ci] : null;
}
function setColFilter(menuKey, ci, allowedOrNull){
  if(!STATE.colFilters[menuKey]) STATE.colFilters[menuKey] = {};
  if(allowedOrNull == null) delete STATE.colFilters[menuKey][ci];
  else STATE.colFilters[menuKey][ci] = allowedOrNull;
}

// 메인 테이블의 데이터 행 (아코디언 하위행 제외)
function colDataRows(table){
  if(!table.tBodies.length) return [];
  return Array.from(table.tBodies[0].rows).filter(function(tr){
    return !tr.classList.contains('insp-sub');
  });
}

// 컬럼의 고유값 목록 (한글·숫자 자연 정렬)
function distinctColValues(table, ci){
  var seen = {}, out = [];
  colDataRows(table).forEach(function(tr){
    var cell = tr.cells[ci];
    var v = cell ? cell.textContent.trim() : '';
    if(!(v in seen)){ seen[v] = 1; out.push(v); }
  });
  out.sort(function(a, b){ return a.localeCompare(b, 'ko', { numeric: true }); });
  return out;
}

// 한 데이터 행이 저장된 컬럼 필터를 통과하는지 판정
function rowPassesColFilter(tr, m){
  var pass = true;
  Object.keys(m).forEach(function(ci){
    if(!pass) return;
    var allowed = m[ci];
    if(!allowed || !allowed.length){ pass = false; return; }   // 전부 해제 → 숨김
    var cell = tr.cells[ci];
    var v = cell ? cell.textContent.trim() : '';
    if(allowed.indexOf(v) < 0) pass = false;
  });
  return pass;
}

// 컬럼 필터 + 페이지네이션을 함께 적용해 행을 표시/숨김 처리
// (필터를 통과한 행만 페이지 단위로 잘라 최대 PAGE_SIZE개만 표시)
function applyColumnFilters(table, menuKey){
  var rows = table.tBodies.length ? Array.from(table.tBodies[0].rows) : [];
  var m = STATE.colFilters[menuKey] || {};

  // 1) 필터 통과 데이터 행 수집 (아코디언 하위행 제외)
  var passRows = rows.filter(function(tr){
    return !tr.classList.contains('insp-sub') && rowPassesColFilter(tr, m);
  });

  // 2) 현재 페이지 보정 + 표시할 행 범위 계산
  var totalPages = Math.max(1, Math.ceil(passRows.length / PAGE_SIZE));
  var page = STATE.page[menuKey] || 1;
  if(page > totalPages) page = totalPages;
  if(page < 1) page = 1;
  STATE.page[menuKey] = page;
  var start = (page - 1) * PAGE_SIZE;
  var pageRows = passRows.slice(start, start + PAGE_SIZE);

  // 3) 표시/숨김 적용 (하위 아코디언 행은 부모 행을 따라감)
  var lastVisible = false;
  rows.forEach(function(tr){
    if(tr.classList.contains('insp-sub')){
      tr.style.display = lastVisible ? '' : 'none';
      return;
    }
    var visible = pageRows.indexOf(tr) >= 0;
    tr.style.display = visible ? '' : 'none';
    lastVisible = visible;
  });

  // 4) 페이지네이션 컨트롤 렌더
  renderPager(table, menuKey, passRows.length, page, totalPages);
}

// 페이지네이션 컨트롤 렌더 + 클릭 핸들러 부착
function renderPager(table, menuKey, total, page, totalPages){
  var box = document.getElementById('pager-' + menuKey);
  if(!box) return;
  if(total <= PAGE_SIZE){ box.innerHTML = ''; return; }   // 한 페이지면 컨트롤 숨김

  var from = (page - 1) * PAGE_SIZE + 1;
  var to   = Math.min(page * PAGE_SIZE, total);

  // 페이지 번호 윈도우 (현재 페이지 기준 ±2, 양끝 보정)
  var win = 2, lo = Math.max(1, page - win), hi = Math.min(totalPages, page + win);
  if(page <= win) hi = Math.min(totalPages, 1 + win * 2);
  if(page > totalPages - win) lo = Math.max(1, totalPages - win * 2);

  var html = '<div class="pager-info">' + from + '–' + to + ' / 총 ' + total + '건</div>'
    + '<div class="pager-btns">';
  html += '<button class="pager-btn" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>이전</button>';
  if(lo > 1){
    html += '<button class="pager-btn" data-page="1">1</button>';
    if(lo > 2) html += '<span class="pager-gap">…</span>';
  }
  for(var p = lo; p <= hi; p++){
    html += '<button class="pager-btn' + (p === page ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
  }
  if(hi < totalPages){
    if(hi < totalPages - 1) html += '<span class="pager-gap">…</span>';
    html += '<button class="pager-btn" data-page="' + totalPages + '">' + totalPages + '</button>';
  }
  html += '<button class="pager-btn" data-page="' + (page + 1) + '"' + (page >= totalPages ? ' disabled' : '') + '>다음</button>';
  html += '</div>';
  box.innerHTML = html;

  Array.from(box.querySelectorAll('.pager-btn')).forEach(function(btn){
    if(btn.disabled) return;
    btn.addEventListener('click', function(){
      var np = parseInt(btn.getAttribute('data-page'), 10);
      if(isNaN(np) || np === page) return;
      STATE.page[menuKey] = np;
      applyColumnFilters(table, menuKey);   // 행 표시만 갱신 (전체 재렌더·재로드 없음)
      // 페이지 이동 시 리스트 상단으로 스크롤
      var panel = table.closest ? table.closest('.panel') : null;
      if(panel && panel.scrollIntoView) panel.scrollIntoView({ block: 'nearest' });
    });
  });
}

function closeColFilterPop(){
  var ex = document.getElementById('col-filter-pop');
  if(ex && ex.parentNode) ex.parentNode.removeChild(ex);
  if(COL_FILTER_DOC_HANDLER){
    document.removeEventListener('mousedown', COL_FILTER_DOC_HANDLER, true);
    COL_FILTER_DOC_HANDLER = null;
  }
}

function openColFilterPop(table, menuKey, ci, btn){
  var sameBtn = COL_FILTER_STATE && COL_FILTER_STATE.btn === btn;
  closeColFilterPop();
  if(sameBtn){ COL_FILTER_STATE = null; return; }   // 같은 버튼 재클릭 → 토글 닫기

  var values = distinctColValues(table, ci);
  var allowed = getColFilter(menuKey, ci);          // null = 전체 선택
  var isChecked = function(v){ return !allowed || allowed.indexOf(v) >= 0; };

  var pop = document.createElement('div');
  pop.className = 'col-filter-pop';
  pop.id = 'col-filter-pop';
  var html = '<input class="cfp-search" type="text" placeholder="검색…">'
    + '<label class="cfp-item cfp-all"><input type="checkbox" class="cfp-all-cb"><span>전체 선택</span></label>'
    + '<div class="cfp-list">';
  values.forEach(function(v, i){
    var disp = v === '' ? '(빈 값)' : v;
    html += '<label class="cfp-item">'
      + '<input type="checkbox" class="cfp-cb" data-idx="' + i + '"' + (isChecked(v) ? ' checked' : '') + '>'
      + '<span title="' + escAttr(disp) + '">' + escHtml(disp) + '</span></label>';
  });
  if(!values.length) html += '<div class="cfp-empty">표시할 값이 없습니다.</div>';
  html += '</div><div class="cfp-foot"><button class="cfp-clear">초기화</button><button class="cfp-close">닫기</button></div>';
  pop.innerHTML = html;
  document.body.appendChild(pop);

  // 위치 — 버튼 우하단 정렬, 화면 밖이면 보정
  var r = btn.getBoundingClientRect();
  var left = r.right - pop.offsetWidth;
  var top = r.bottom + 4;
  if(left < 8) left = 8;
  if(top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 4);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';

  COL_FILTER_STATE = { btn: btn, table: table, menuKey: menuKey, ci: ci };

  var listCbs = function(){ return Array.from(pop.querySelectorAll('.cfp-cb')); };
  var allCb = pop.querySelector('.cfp-all-cb');
  var syncAllCb = function(){
    var cbs = listCbs();
    var on = cbs.filter(function(c){ return c.checked; }).length;
    allCb.checked = cbs.length > 0 && on === cbs.length;
    allCb.indeterminate = on > 0 && on < cbs.length;
  };
  syncAllCb();

  var commit = function(){
    var checkedVals = [];
    listCbs().forEach(function(c){ if(c.checked) checkedVals.push(values[+c.getAttribute('data-idx')]); });
    if(checkedVals.length === values.length){
      setColFilter(menuKey, ci, null);          // 전체 선택 → 필터 해제
      btn.classList.remove('active');
    } else {
      setColFilter(menuKey, ci, checkedVals);
      btn.classList.add('active');
    }
    STATE.page[menuKey] = 1;   // 컬럼 필터 변경 → 첫 페이지로
    applyColumnFilters(table, menuKey);
  };

  allCb.addEventListener('change', function(){
    var on = allCb.checked;
    listCbs().forEach(function(c){ c.checked = on; });
    allCb.indeterminate = false;
    commit();
  });
  listCbs().forEach(function(c){
    c.addEventListener('change', function(){ syncAllCb(); commit(); });
  });

  var search = pop.querySelector('.cfp-search');
  search.addEventListener('input', function(){
    var q = search.value.trim().toLowerCase();
    Array.from(pop.querySelectorAll('.cfp-list .cfp-item')).forEach(function(lab){
      lab.style.display = (!q || lab.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
    });
  });
  pop.querySelector('.cfp-clear').addEventListener('click', function(){
    listCbs().forEach(function(c){ c.checked = true; });
    setColFilter(menuKey, ci, null);
    btn.classList.remove('active');
    STATE.page[menuKey] = 1;   // 컬럼 필터 초기화 → 첫 페이지로
    applyColumnFilters(table, menuKey);
    syncAllCb();
  });
  pop.querySelector('.cfp-close').addEventListener('click', function(){
    closeColFilterPop();
    COL_FILTER_STATE = null;
  });

  pop.addEventListener('mousedown', function(ev){ ev.stopPropagation(); });
  COL_FILTER_DOC_HANDLER = function(ev){
    if(pop.contains(ev.target) || btn.contains(ev.target)) return;
    closeColFilterPop();
    COL_FILTER_STATE = null;
  };
  document.addEventListener('mousedown', COL_FILTER_DOC_HANDLER, true);
  search.focus();
}

// ─── 메뉴별 렌더 ─────────────────────────────
// 최신 생성 건이 앞단에 오도록 내림차순 정렬 (원본 배열은 보존하기 위해 복제 후 정렬)
function sortByNewest(rows, key){
  key = key || 'submitAt';
  return (rows || []).slice().sort(function(a, b){
    return String(b[key] || '').localeCompare(String(a[key] || ''));
  });
}

  var body = '<table><thead><tr><th>유형</th><th>문서번호</th><th>제목</th><th>기안자</th><th>거래처</th><th>상태</th><th>일자</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var typeLabel = docTypeText(r.docType);
    var typeCls   = r.docType==='PRC' ? 'docno prc' : (r.docType==='INSP' ? 'docno ir' : 'docno');
    var clickAttr = r.docType==='INSP'
      ? 'data-insp-view="' + escAttr(r.token) + '"'
      : 'data-view-token="' + escAttr(r.token) + '" data-docno="' + escAttr(r.docNo) + '"';
    body += '<tr class="row-clickable" ' + clickAttr + '>'
      + '<td><span class="' + typeCls + '">' + escHtml(typeLabel) + '</span></td>'
      + '<td><span class="' + typeCls + '">' + escHtml(r.docNo) + '</span></td>'
      + '<td>' + escHtml(r.subject) + '</td>'
      + '<td>' + drafterCell(r) + '</td>'
      + '<td>' + escHtml(r.vendorName) + '</td>'
      + '<td>' + statusBadge(r.status)
      + (r.prcCreated ? ' <span class="status prc_made">구매 진행</span>' : '')
      + '</td>'
      + '<td>' + escHtml(r.issueDate || r.submitAt || '') + '</td>'
      + '</tr>';
  });
  body += '</tbody></table>';
  return body;
}

// ─── [INSP Step 2] 결재 완료 메뉴 ─────────────────────────────
// 최종승인(PRC) 문서의 최종 승인 확인 + 검수보고서 회차 관리 (아코디언)
function renderCompleted(){
  var d = STATE.data || {};
  var docs = d.completedDocs || [];
  var u = STATE.user || {};
  var isProc = !!u.isProcurement;

  // 검수 진행 상태(poInspState)별 분류 → KPI 카드 클릭으로 필터
  var inspKey = function(x){
    var k = poInspState(x).key;
    if(k === 'none') return 'none';
    if(k === 'closed') return 'closed';
    return 'prog';   // rejected / approving / partial → 검수 진행 중
  };
  var segments = [
    { key:'all',    label:'결재 완료(구매)', rows: docs },
    { key:'none',   label:'검수 미제출',    rows: docs.filter(function(x){ return inspKey(x) === 'none'; }) },
    { key:'prog',   label:'검수 진행 중',    rows: docs.filter(function(x){ return inspKey(x) === 'prog'; }) },
    { key:'closed', label:'검수 종결',      rows: docs.filter(function(x){ return inspKey(x) === 'closed'; }) },
  ];

  var myDept  = (u.dept) || '';
  var isAdmin = !!u.isAdmin;
  // 관리자는 '조회'만 전사로 넓어진다 — 검수보고서 제출권(canSubmit)은 서버에서 여전히
  // 본인/같은 부서로 제한되므로 안내 문구도 조회 범위만 확장해 적는다.
  var scopeNote = isAdmin ? '관리자 권한으로 전사 문서가 조회됩니다(검수보고서 제출은 본인·같은 부서 건만 가능).'
                : isProc  ? '구매팀 권한으로 전체 문서가 표시됩니다.'
                : ('본인이 기안했거나' + (myDept ? ' 같은 부서(' + escHtml(myDept) + ')에서' : '') + ' 기안한 품의가 표시되며, 같은 부서 건은 검수보고서도 제출할 수 있습니다.');
  var sub = '최종승인(구매)된 구매 품의의 최종 승인 확인 및 검수보고서 제출 메뉴입니다. '
    + scopeNote
    + ' 행을 클릭하면 회차별 검수 이력이 펼쳐집니다.';

  return pageHead('결재 완료', sub)
    + kpiFilterSection('completed', segments, {
        panelTitle: '최종 승인 문서',
        scopeClass: isAdmin ? 'admin' : (isProc ? 'proc' : ''),
        scopeSuffix: isAdmin ? ' · 전사' : (isProc ? ' · 전체' : ''),
        renderTable: completedTable
      });
}

// 결재 완료 — 표 본문 (회차별 검수 이력 아코디언)
function completedTable(docs){
  if(!docs || docs.length === 0){
    return '<div class="empty"><div class="empty-icon">📭</div>표시할 결재 완료 문서가 없습니다.</div>';
  }
  var body = '<table><thead><tr>'
    + '<th>품의 번호</th><th>PO 번호</th><th>제목</th><th>기안자</th><th>거래처</th><th>결재</th><th>검수 상태</th><th class="num">검수</th>'
    + '</tr></thead><tbody>';
  docs.forEach(function(x){
    var open = !!STATE.openCompleted[x.prcToken];
    var st = poInspState(x);
    body += '<tr class="po-row' + (open ? ' open' : '') + '" data-toggle-insp="' + escAttr(x.prcToken) + '">'
      + '<td><span class="chev">▶</span><span class="docno">' + escHtml(x.reqNo) + '</span></td>'
      + '<td>' + (x.poNo
          ? '<span class="docno prc po-link" data-po-view="' + escAttr(x.prcToken) + '" data-po-docno="' + escAttr(x.poNo) + '" title="결재 완료된 구매(PO) 문서 보기">' + escHtml(x.poNo) + '</span>'
          : '<span class="docno prc">-</span>') + '</td>'
      + '<td>' + escHtml(x.subject) + '</td>'
      + '<td>' + drafterCell(x) + '</td>'
      + '<td>' + escHtml(x.vendorName) + '</td>'
      + '<td>' + statusBadge('최종승인(PRC)') + '</td>'
      + '<td><span class="status ' + st.cls + '">' + escHtml(st.label) + '</span></td>'
      + '<td class="num">' + (x.insps || []).length + '건</td>'
      + '</tr>';
    if(open) body += inspSubRows(x);
  });
  body += '</tbody></table>';
  return body;
}

// PO(품의) 단위 검수 집계 상태 — 저장하지 않고 계산 (설계서 §3)
function poInspState(x){
  var insps = x.insps || [];
  if(insps.length === 0) return { key:'none', label:'검수 미제출', cls:'insp-none' };
  if(x.inspClosed) return { key:'closed', label:'검수 완료 (종결)', cls:'insp-closed' };
  var hasRejected = false, approving = 0, done = 0;
  insps.forEach(function(s){
    if(s.status === '반려') hasRejected = true;
    else if(s.status === '검토중' || s.status.indexOf('결재중') >= 0) approving++;
    else if(s.status === '최종승인(INSP)') done++;
  });
  if(hasRejected) return { key:'rejected', label:'검수 반려 있음', cls:'rejected' };
  if(approving > 0) return { key:'approving', label:'검수 결재중 ' + approving + '건', cls:'in_appr' };
  return { key:'partial', label:'검수 ' + done + '회 완료 (진행 중)', cls:'final' };
}

// 아코디언 하위 — 회차별 검수보고서 목록
function inspSubRows(x){
  // canSubmit: 본인 기안 또는 같은 부서(서버 판정). 검수보고서 제출/재상신 가능 여부
  var canSubmit = !!x.canSubmit;
  var inner;

  if((x.insps || []).length === 0){
    inner = '<div style="color:var(--ink-soft);font-size:12px;padding:4px 0;">아직 제출된 검수보고서가 없습니다.</div>';
  } else {
    inner = '<table class="insp-sub-table"><thead><tr>'
      + '<th style="width:150px;">검수보고서 번호</th><th style="width:80px;">입고일</th><th>입고 내역</th>'
      + '<th style="width:70px;">판정</th><th style="width:130px;">상태</th><th style="width:100px;"></th>'
      + '</tr></thead><tbody>';
    x.insps.forEach(function(s){
      var act = '';
      if(s.status === '반려' && canSubmit){
        act = '<button class="btn-insp' + (INSP_FORM_ENABLED ? '' : ' pending-feature') + '"'
            + ' data-insp-form="' + escAttr(x.prcToken) + '" data-insp-resub="' + escAttr(s.token) + '">수정 재상신</button>';
      }
      var stTxt = s.status;
      if((s.status === '검토중' || s.status.indexOf('결재중') >= 0) && s.currentApprName){
        stTxt = '결재중 (' + s.currentApprName + ')';
      }
      inner += '<tr>'
        + '<td><span class="docno ir">' + escHtml(s.docNo) + '</span>' + (s.isFinal ? ' <span class="final-flag">★최종</span>' : '') + '</td>'
        + '<td>' + escHtml(s.receivedDate) + '</td>'
        + '<td>' + escHtml(s.receivedNote) + '</td>'
        + '<td>' + escHtml(s.verdict || '-') + '</td>'
        + '<td>' + statusBadge(stTxt) + '</td>'
        + '<td style="text-align:right;">' + act + '</td>'
        + '</tr>';
    });
    inner += '</tbody></table>';
  }

  var footer;
  if(!canSubmit){
    footer = '<div style="margin-top:9px;font-size:11px;color:var(--ink-mute);">검수보고서 제출은 품의 기안자(' + escHtml(x.drafterName || x.drafter) + ') 또는 같은 부서 담당자만 가능합니다.</div>';
  } else if(x.inspClosed){
    footer = '<div style="margin-top:9px;font-size:11px;color:#0e7d72;font-weight:700;">★ 최종 검수가 승인되어 종결된 품의입니다. (추가 제출 불가)</div>';
  } else if(x.inspLocked){
    footer = '<div style="margin-top:9px;font-size:11px;color:#d97706;font-weight:700;">⏳ 최종 검수 보고서가 결재 진행 중입니다. 추가 제출이 불가합니다. (반려 시 재상신 가능)</div>';
  } else {
    var nextSeq = 1;
    (x.insps || []).forEach(function(s){ if(s.seq >= nextSeq) nextSeq = s.seq + 1; });
    footer = '<button class="btn-insp' + (INSP_FORM_ENABLED ? '' : ' pending-feature') + '" style="margin-top:9px;"'
      + ' data-insp-form="' + escAttr(x.prcToken) + '">+ 검수보고서 제출 (' + (nextSeq < 10 ? '0' + nextSeq : nextSeq) + '회차)</button>';
  }

  return '<tr class="insp-sub"><td colspan="8"><div class="insp-sub-box">' + inner + footer + '</div></td></tr>';
}

// ─── 표 렌더 ─────────────────────────────
function tableOfDocs(rows, mode, showAppr){
  if(!rows || rows.length === 0){
    return '<div class="empty"><div class="empty-icon">📭</div>표시할 문서가 없습니다.</div>';
  }
  var html = '<table>';
  if(mode === 'inbox'){
    html += '<thead><tr><th>품의번호</th><th>제목</th><th>기안자</th><th>거래처</th><th class="num">금액</th><th>1차 승인일</th><th>점유</th><th></th></tr></thead><tbody>';
    rows.forEach(function(r){ html += inboxRow(r); });
  } else if(mode === 'myprc'){
    html += '<thead><tr><th>유형</th><th>품의번호</th><th>제목</th><th>거래처</th><th class="num">금액</th><th>상태</th><th></th></tr></thead><tbody>';
    rows.forEach(function(r){ html += myPrcRow(r); });
  } else if(mode === 'pending'){
    html += '<thead><tr><th>유형</th><th>품의번호</th><th>제목</th><th>기안자</th>'
      + (showAppr ? '<th>현재 결재자</th>' : '')
      + '<th>거래처</th><th class="num">금액</th><th>상태</th></tr></thead><tbody>';
    rows.forEach(function(r){ html += pendingRow(r, showAppr); });
  } else {
    html += '<thead><tr><th>유형</th><th>품의번호</th><th>제목</th><th>기안자</th><th>거래처</th><th class="num">금액</th><th>상태</th><th>제출일</th></tr></thead><tbody>';
    rows.forEach(function(r){ html += docRow(r); });
  }
  html += '</tbody></table>';
  return html;
}

function inboxRow(r){
  var actor = (STATE.user || {}).email || '';
  var claimed = r.claimedBy || '';
  var claimDisplay = '';
  if(claimed){
    if(claimed === actor){
      claimDisplay = '<span class="claim-info">내가 점유 중</span>';
    } else {
      claimDisplay = '<span class="claim-info other">' + escHtml(claimed) + ' 작업 중</span>';
    }
  } else {
    claimDisplay = '<span style="color:var(--ink-mute);font-size:11px;">대기 중</span>';
  }
  var canPickup = !claimed || claimed === actor;
  return '<tr>'
    + '<td><span class="docno">' + escHtml(r.docNo) + '</span></td>'
    + '<td>' + escHtml(r.subject) + '</td>'
    + '<td>' + escHtml(r.drafter) + ' <span style="color:var(--ink-mute);font-size:11px;">(' + escHtml(r.dept) + ')</span></td>'
    + '<td>' + escHtml(r.vendorName) + '</td>'
    + '<td class="num">' + fmtAmt(r.amount) + '</td>'
    + '<td>' + escHtml(r.submitAt) + '</td>'
    + '<td>' + claimDisplay + '</td>'
    + '<td>' + (canPickup ?
        '<button class="pickup-btn" data-pickup="' + escAttr(r.token) + '">' + (claimed === actor ? '계속 작업' : '구매 문서 생성') + '</button>'
        : '<button class="pickup-btn" disabled>다른 담당자</button>')
    + '</td></tr>';
}

function myPrcRow(r){
  var type = r._type === 'claimed_req' ? '품의(점유)' : '구매';
  var typeClass = r._type === 'claimed_req' ? 'docno' : 'docno prc';

    actionBtn = '<button class="pickup-btn" data-prc-resume="' + escAttr(r.token) + '">계속 작성</button>';

    + '<td><span class="' + typeClass + '">' + type + '</span></td>'

    + '<td>' + escHtml(r.subject) + '</td>'
    + '<td>' + escHtml(r.vendorName) + '</td>'
    + '<td class="num">' + fmtAmt(r.amount) + '</td>'

function docRow(r){

// 반려된 본인 기안 건: 상태 배지 옆에서 바로 재상신/폐기 화면으로 진입 (반려 안내 메일의 버튼과 같은 목적지)
// 부서 동료의 반려 건은 열람만 가능하므로 버튼을 노출하지 않는다.
function rejectActionBtn(r){
  if(!r.mine || r.status !== '반려') return '';
  return '<button type="button" class="reject-act-btn"'
    + ' data-reject-token="' + escAttr(r.token) + '"'
    + ' data-reject-docno="' + escAttr(r.docNo) + '">재상신/폐기</button>';
}

// 기안자 셀: 부서 공유 목록에서 내 문서/부서 동료 문서를 구분 (내 문서엔 '나' 배지)
// drafterName(이름) 우선 — 일부 목록은 drafter가 이메일이므로 이름을 먼저 사용
function drafterCell(r){
  var name = escHtml(r.drafterName || r.drafter || '');
  if(r.mine){
    return name + ' <span title="본인 기안" aria-label="본인 기안" style="color:#f5b301;'

}

// ─── PRC 픽업 ─────────────────────────────
// v2.1: 토스트 + setTimeout(600ms) 경쟁 조건 제거
//       → 모달 기반 처리 (페이지 전환 완료까지 모달 유지, 백드롭으로 입력 차단)
var PKMODAL = {
  el: null, body: null, footer: null, title: null,
  stepTimers: [],
  parentToken: null,
};

function pkmodalInit(){
  if(PKMODAL.el) return;
  PKMODAL.el     = document.getElementById('pkmodal-backdrop');
  PKMODAL.body   = document.getElementById('pkmodal-body');
  PKMODAL.footer = document.getElementById('pkmodal-footer');
  PKMODAL.title  = document.getElementById('pkmodal-title');
}

function pkmodalOpen(){
  pkmodalInit();
  PKMODAL.el.classList.add('show');
  PKMODAL.el.setAttribute('aria-hidden','false');
}

function pkmodalClose(){
  pkmodalInit();
  PKMODAL.el.classList.remove('show');
  PKMODAL.el.setAttribute('aria-hidden','true');
  pkmodalClearStepTimers();
}

function pkmodalClearStepTimers(){
  for(var i = 0; i < PKMODAL.stepTimers.length; i++){
    clearTimeout(PKMODAL.stepTimers[i]);
  }
  PKMODAL.stepTimers = [];
}

function pkmodalSetTitle(text){ PKMODAL.title.textContent = text; }
function pkmodalSetFooter(html){
  PKMODAL.footer.innerHTML = html || '';
  PKMODAL.footer.className = 'pkmodal-footer' + (html ? '' : ' empty');
}

// 처리 중 화면 (스피너 + 4단계 진행 표시)
// step: 'lock' | 'verify' | 'commit' | 'navigate'
function pkmodalRenderProcessing(step){
  pkmodalSetTitle('구매 문서 픽업 처리 중');
  pkmodalSetFooter('');
  var steps = [
    { key:'lock',     label:'구매팀 락(Lock) 점유 요청' },
    { key:'verify',   label:'품의 상태 및 권한 확인' },
    { key:'commit',   label:'점유자 정보 기록' },
    { key:'navigate', label:'구매 문서 작성 화면으로 이동' }
  ];
  var idx = 0;
  for(var i = 0; i < steps.length; i++){ if(steps[i].key === step){ idx = i; break; } }

  var html = '<div class="pkmodal-spinner"></div>'
    + '<p class="pkmodal-message">픽업 처리 중...</p>'
    + '<p class="pkmodal-detail">잠시만 기다려 주세요. 완료되면 자동으로 화면이 전환됩니다.</p>'
    + '<div class="pkmodal-steps">';
  for(var j = 0; j < steps.length; j++){
    var cls = '';
    if(j < idx) cls = 'done';
    else if(j === idx) cls = 'active';
    html += '<div class="pkmodal-step ' + cls + '"><div class="pkmodal-step-dot"></div>'
         + escHtml(steps[j].label) + '</div>';
  }
  html += '</div>';
  PKMODAL.body.innerHTML = html;
}

// 성공 화면
function pkmodalRenderSuccess(res){
  pkmodalSetTitle('픽업 완료');
  var claimedBy = (res && res.claimedBy) ? res.claimedBy : '';
  var claimedAt = (res && res.claimedAt) ? res.claimedAt : '';
  PKMODAL.body.innerHTML =
    '<div class="pkmodal-success"><svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 8"/></svg></div>'
    + '<p class="pkmodal-message ok">픽업 완료</p>'
    + '<div class="pkmodal-info">'
      + '<div class="pkmodal-info-row"><span class="lbl">점유자</span><span class="val">' + escHtml(claimedBy) + '</span></div>'
      + '<div class="pkmodal-info-row"><span class="lbl">점유 시각</span><span class="val">' + escHtml(claimedAt) + '</span></div>'
      + '<div class="pkmodal-info-row"><span class="lbl">다음 단계</span><span class="val">구매 문서 작성 화면으로 이동</span></div>'
    + '</div>'
    + '<p class="pkmodal-detail pkmodal-detail-row" id="pkmodal-success-status">'
      + '<span class="pkmodal-spinner sm"></span>'
      + '구매 문서 작성 화면을 여는 중...'
    + '</p>';
  // 사용자 클릭 컨텍스트에서 navigation을 보장하기 위한 fallback 버튼 (항상 표시)
  pkmodalSetFooter('<button type="button" class="pkmodal-btn primary" onclick="pickupGoToPrc()">구매 문서 작성 화면으로 이동</button>');
}

// PRC 작성 화면으로 이동
// 두 경로에서 호출됨:
//   1) 자동 시도 (setTimeout 콜백) — user activation 만료 시 SecurityError throw → catch로 안내 텍스트 갱신
//   2) 사용자가 모달 버튼 클릭 — fresh activation 보장 → 항상 성공
function pickupGoToPrc(){
  var token = PKMODAL.parentToken;
  if(!token) return;
  try {
    window.top.location.href = WEBAPP_URL + '?action=prc&parentId=' + encodeURIComponent(token);
  } catch(err){
    // 자동 nav가 user activation 만료로 차단됨 — 사용자에게 버튼 클릭 유도
    var statusEl = document.getElementById('pkmodal-success-status');
    if(statusEl){
      // flex(가로 배치) 해제 → 가운데 정렬 블록으로 전환해야 <br> 줄바꿈이 적용됨
      statusEl.className = 'pkmodal-detail';
      statusEl.innerHTML =
        '<span style="color:var(--danger);font-weight:600;">⚠ 자동 전환이 차단되었습니다.</span>'
        + '<br><span style="color:var(--ink-mute);">아래 버튼을 눌러 구매 문서 작성 화면으로 이동해 주세요.</span>';
    }
  }
}

// 실패 화면 (claimed / not-req / auth / network 등)
function pkmodalRenderError(opts){
  pkmodalSetTitle('픽업 실패');
  var msg     = opts.message || '알 수 없는 오류';
  var infoRows = opts.infoRows || [];
  var isNetwork = !!opts.isNetwork;
  var canRetry  = !!opts.canRetry;

  var infoHtml = '';
  if(infoRows.length){
    infoHtml = '<div class="pkmodal-info">';
    for(var i = 0; i < infoRows.length; i++){
      infoHtml += '<div class="pkmodal-info-row"><span class="lbl">' + escHtml(infoRows[i][0])
               + '</span><span class="val">' + escHtml(infoRows[i][1]) + '</span></div>';
    }
    infoHtml += '</div>';
  }

  PKMODAL.body.innerHTML =
    '<div class="pkmodal-error">!</div>'
    + '<p class="pkmodal-message err">' + escHtml(msg) + '</p>'
    + (opts.detail ? '<p class="pkmodal-detail">' + escHtml(opts.detail) + '</p>' : '')
    + infoHtml;

  var footer = '<button type="button" class="pkmodal-btn secondary" onclick="pkmodalClose()">닫기</button>';
  if(canRetry){
    footer += '<button type="button" class="pkmodal-btn primary" onclick="pickupRetry()">다시 시도</button>';
  } else if(!isNetwork){
    // 점유 충돌·상태 오류 → 인박스 새로고침이 유효한 액션
    footer += '<button type="button" class="pkmodal-btn primary" onclick="pkmodalClose();loadHome();">인박스 새로고침</button>';
  }
  pkmodalSetFooter(footer);
}

// 재시도 (네트워크 오류 시) — 이미 확인을 거쳤으므로 곧바로 처리 단계로 진입
function pickupRetry(){
  if(PKMODAL.parentToken) pickupConfirm();
}

// 픽업 확인 화면 (네이티브 confirm 대체) — 모달 + 백드롭으로 표시
// [픽업] → pickupConfirm()으로 실제 점유 요청 / [취소] → 모달 닫고 대시보드 복귀
function pkmodalRenderConfirm(){
  pkmodalSetTitle('구매 문서 픽업 확인');
  PKMODAL.body.innerHTML =
    '<div class="pkmodal-confirm">📥</div>'
    + '<p class="pkmodal-message">이 품의를 픽업하여 구매 문서 생성을 시작하시겠습니까?</p>'
    + '<p class="pkmodal-detail">픽업 시 30초간 락(Lock)이 점유되며, 그동안 다른 담당자는 이 품의를 픽업할 수 없습니다.</p>';
  pkmodalSetFooter(
    '<button type="button" class="pkmodal-btn secondary" onclick="pickupCancel()">취소</button>'
    + '<button type="button" class="pkmodal-btn primary" onclick="pickupConfirm()">픽업</button>'
  );
}

// 취소 — 이벤트에서 빠져나와 모달을 닫고 대시보드(인박스)로 복귀
function pickupCancel(){
  pkmodalClose();
  PKMODAL.parentToken = null;
}

// 픽업 진입점 — 확인 모달을 띄운다 (실제 요청은 [픽업] 버튼 → pickupConfirm)
function pickupReq(parentToken){
  PKMODAL.parentToken = parentToken;
  pkmodalOpen();
  pkmodalClearStepTimers();
  pkmodalRenderConfirm();
}

// 실제 점유 요청 — 처리 중 화면 → 성공/실패 모달
function pickupConfirm(){
  var parentToken = PKMODAL.parentToken;
  if(!parentToken) return;

  pkmodalClearStepTimers();
  pkmodalRenderProcessing('lock');

  // 응답 대기 동안 단계 표시를 시각적으로 진행 (실제 서버 단계와 1:1 대응은 아니며 UX용)
  // 첫 진입 cold start (~2-3초) 시 사용자에게 "멈춘 게 아님"을 보여주기 위함
  PKMODAL.stepTimers.push(setTimeout(function(){ pkmodalRenderProcessing('verify'); }, 500));
  PKMODAL.stepTimers.push(setTimeout(function(){ pkmodalRenderProcessing('commit'); }, 1400));

  google.script.run
    .withSuccessHandler(function(res){
      pkmodalClearStepTimers();
      if(res && res.ok){
        // 최종 단계 표시 → 성공 화면 → 페이지 전환
        // 페이지 전환은 모달이 열린 상태에서 트리거됨. 새 페이지 로드 시 자연스럽게 사라짐.
        pkmodalRenderProcessing('navigate');
        setTimeout(function(){
          pkmodalRenderSuccess(res);
          // 자동 전환 시도 (warm 상태에서는 성공, cold start로 activation 만료 시엔 catch로 빠져 안내 텍스트 갱신)
          // 어느 경우든 모달의 [PRC 작성 화면으로 이동] 버튼이 fallback으로 항상 작동
          setTimeout(function(){
            pickupGoToPrc();
          }, 700);
        }, 250);
      } else {
        var msg = (res && res.message) ? res.message : '알 수 없는 오류';
        var info = [];
        if(res && res.claimedBy){
          info.push(['점유자', res.claimedBy]);
          if(res.claimedAt) info.push(['점유 시각', res.claimedAt]);
        }
        pkmodalRenderError({
          message: '픽업 실패',
          detail: msg,
          infoRows: info,
          canRetry: false
        });
      }
    })
    .withFailureHandler(function(err){
      pkmodalClearStepTimers();
      var emsg = (err && err.message) ? err.message : String(err);
      pkmodalRenderError({
        message: '네트워크 오류',
        detail: emsg + '\n잠시 후 다시 시도해 주세요.',
        isNetwork: true,
        canRetry: true
      });
    })
    .claimRequestForClient({ parentToken: parentToken });
}

// ─── 보조 ─────────────────────────────
function pageHead(title, sub){
  return '<div class="page-head"><div><div class="page-title">' + escHtml(title) + '</div>'
    + (sub ? '<div class="page-sub">' + escHtml(sub) + '</div>' : '')
    + '</div><div><button class="btn btn-primary" onclick="loadHome()">새로고침</button></div></div>';
}
// 통일된 KPI 카드. key가 있으면 클릭 가능한 필터 카드, active면 강조(선택 상태).
function kpiCard(label, value, key, active){
  var clickable = (key != null);
  return '<div class="kpi-card' + (active ? ' highlight' : '') + (clickable ? ' kpi-click' : '') + '"'
    + (clickable ? ' data-kpi="' + escAttr(key) + '"' : '') + '>'
    + '<div class="kpi-label">' + escHtml(label) + '</div>'
    + '<div class="kpi-value">' + value + '<span class="kpi-unit"> 건</span></div></div>';
}

// 메뉴 공통: KPI 카드 그리드 + 현재 필터로 걸러진 테이블 패널을 한 번에 생성.
//   menuKey  : STATE.filters 키 (현재 메뉴)
//   segments : [{ key, label, rows }] — 첫 항목이 '전체'(필터 기본값)
//   opts     : { panelTitle, scopeClass, scopeSuffix, renderTable(rows)->html }
function kpiFilterSection(menuKey, segments, opts){
  opts = opts || {};
  var active = STATE.filters[menuKey];
  var cur = null;
  for(var i = 0; i < segments.length; i++){ if(segments[i].key === active){ cur = segments[i]; break; } }
  if(!cur){ cur = segments[0]; active = segments[0].key; }   // 정의에 없으면 전체로 폴백

  var cards = '<div class="kpi-grid" style="grid-template-columns:repeat(' + segments.length + ',1fr);">';
  segments.forEach(function(s){
    cards += kpiCard(s.label, s.rows.length, s.key, s.key === active);
  });
  cards += '</div>';

  var renderTable = opts.renderTable || function(){ return ''; };
  var panel = '<div class="panel">';
  if(opts.panelTitle){
    var scopeCls = 'scope-tag' + (opts.scopeClass ? ' ' + opts.scopeClass : '');
    panel += '<div class="panel-head"><div><span class="panel-title">' + escHtml(opts.panelTitle) + '</span>'
      + '<span class="' + scopeCls + '">' + cur.rows.length + '건' + (opts.scopeSuffix || '') + '</span>'
      + '</div></div>';
  }
  panel += renderTable(cur.rows);
  // 페이지네이션 컨트롤 컨테이너 (행 표시는 applyColumnFilters에서 페이지 단위로 처리)
  panel += '<div class="pager" id="pager-' + escAttr(menuKey) + '"></div>';
  panel += '</div>';
  return cards + panel;
}
// 유형 표시 라벨 — 데이터값(docType)은 그대로 두고 화면 표기만 한글화
function docTypeText(t){
  if(t === 'REQ') return '품의';
  if(t === 'PRC') return '구매';
  if(t === 'INSP') return '검수';
  return t;
}
// 상태 표기도 화면에서만 한글화 (비교/분류 로직은 원본 status 값을 사용)
function statusLabel(status){
  return String(status == null ? '' : status).replace('PRC', '구매').replace('REQ', '품의');
}
function statusBadge(status){
  var cls = 'unknown';
  if(status === '검토중') cls = 'review';
  else if(status.indexOf('결재중') >= 0) cls = 'in_appr';
  else if(status === '최종승인' || status === '최종승인(PRC)' || status === '최종승인(INSP)') cls = 'final';
  else if(status === '반려') cls = 'rejected';
  else if(status === '재상신') cls = 'resubmit';
  else if(status === 'PRC생성됨') cls = 'prc_made';
  return '<span class="status ' + cls + '">' + escHtml(statusLabel(status)) + '</span>';
}
function fmtAmt(n){
  if(!n) return '-';
  return Number(n).toLocaleString('ko-KR') + ' 원';
}
function escHtml(s){
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(s){ return escHtml(s).replace(/'/g, '&#39;'); }

function toast(type, msg){
  var el = document.getElementById('toast');
  el.className = 'toast ' + type + ' show';
  el.textContent = msg;
  setTimeout(function(){ el.className = 'toast'; }, 3000);
}
function showError(msg){
  document.getElementById('content').innerHTML =
    '<div class="role-empty-state"><h3>오류 발생</h3><div>' + escHtml(msg) + '</div>'
    + '<div style="margin-top:16px;"><button class="btn btn-primary" onclick="loadHome()">다시 시도</button></div></div>';
}

boot();
</script>
