<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<title>검수보고서 작성</title>
<style>
  :root {
    --bg:#f4f5f7; --panel:#fff; --ink:#1a1d23; --ink-soft:#4a5260; --ink-mute:#8b94a3;
    --line:#e3e6eb; --line-soft:#eef0f3;
    --insp:#0e7d72; --insp-soft:#e4f4f2; --insp-dark:#0a5e56;
    --accent:#1a6fc4; --ok:#27ae60; --ok-soft:#e8f6ee;
    --danger:#d64541; --danger-soft:#fdecec; --neutral-soft:#f0f2f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Malgun Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.55;padding:0 0 60px;}
  .topbar{background:var(--insp);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .t{font-weight:700;font-size:15px;}
  .topbar .s{font-size:11.5px;opacity:.85;}
  .wrap{max-width:880px;margin:22px auto;padding:0 18px;}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;}
  .sec-h{padding:11px 16px;border-bottom:1px solid var(--line-soft);font-weight:700;font-size:12.5px;background:#fbfbfc;display:flex;align-items:center;gap:8px;}
  .sec-h .dot{width:8px;height:8px;border-radius:50%;background:var(--insp);}
  .grid{display:grid;grid-template-columns:130px 1fr 130px 1fr;}
  .lbl{background:#fbfbfc;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);padding:10px 12px;font-size:11.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;}
  .val{border-bottom:1px solid var(--line-soft);padding:8px 12px;display:flex;align-items:center;}
  .val.ro{color:var(--ink-soft);background:#fcfcfd;}
  .val.span3{grid-column:span 3;}
  .val input,.val select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;font-family:inherit;}
  .auto{font-size:10px;font-weight:700;color:var(--insp);background:var(--insp-soft);border-radius:8px;padding:1px 6px;margin-left:7px;white-space:nowrap;}

  .body{padding:14px 16px;}
  textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:12.5px;font-family:inherit;min-height:70px;resize:vertical;}
  .verdict-row{display:flex;gap:10px;margin-bottom:12px;}
  .verdict{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:11px;text-align:center;font-weight:700;cursor:pointer;color:var(--ink-soft);user-select:none;}
  .verdict.pass.sel{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);}
  .verdict.fail.sel{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}

  .pz{border:1.5px dashed var(--line);border-radius:9px;padding:18px;text-align:center;color:var(--ink-mute);cursor:pointer;margin-top:12px;transition:border-color .15s,background .15s,color .15s;}
  .pz:hover{border-color:var(--insp);color:var(--insp);background:var(--insp-soft);}
  .pz.dragover{border-color:var(--insp);color:var(--insp);background:var(--insp-soft);}
  .pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px;}
  .pi{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafafa;}
  .pi img{width:100%;height:104px;object-fit:cover;display:block;}
  .pi .m{font-size:10.5px;color:var(--ink-mute);padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pi .d{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:11px;line-height:1;}
  .pi .wait{height:104px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-mute);}
  .notice{margin-top:10px;font-size:11.5px;color:var(--ink-soft);background:#fef3e2;border:1px solid #f3dcb8;border-radius:7px;padding:8px 11px;}
  .fc{display:flex;align-items:flex-start;gap:9px;background:var(--insp-soft);border:1px solid #c8e2de;border-radius:8px;padding:11px 13px;margin-top:13px;cursor:pointer;}
  .fc input{margin-top:3px;}
  .fc b{color:var(--insp);}
  .fc .ds{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  /* [v1.1] 입고 품목 표 — PRC 품목별 이번 회차 입고 수량 (2026-11-05) */
  .rc-wrap{padding:12px 16px 6px;overflow-x:auto;}
  table.rc{border-collapse:collapse;width:100%;min-width:720px;font-variant-numeric:tabular-nums;}
  .rc th{background:#f6f7f9;font-size:10.5px;font-weight:700;color:var(--ink-soft);padding:7px 8px;border-bottom:1.5px solid var(--line);text-align:center;white-space:nowrap;}
  .rc th.l,.rc td.l{text-align:left;}
  .rc td{padding:6px 8px;border-bottom:1px solid var(--line-soft);font-size:12px;text-align:center;vertical-align:middle;}
  .rc tr.done td{color:var(--ink-mute);}
  .rc .nm{font-weight:600;}
  .rc .num{font-weight:700;}
  .rc .remain{color:#b4530a;font-weight:700;}
  .rc tr.done .remain{color:var(--ok);}
  .rc input[type=number]{width:84px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;font-family:inherit;text-align:right;}
  .rc input[type=number]:disabled{background:var(--bg);color:#aaa;}
  .rc input.rc-reason{width:100%;min-width:150px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11.5px;font-family:inherit;}
  .rc input.rc-reason:disabled{background:transparent;border-color:transparent;}
  .rc input.rc-reason.need{border-color:var(--danger);background:#fff8f8;}
  .st{display:inline-block;font-size:10px;font-weight:700;border-radius:9px;padding:1px 7px;white-space:nowrap;}
  .st.done{background:var(--ok-soft);color:var(--ok);}
  .st.part{background:var(--neutral-soft);color:var(--ink-soft);}
  .st.over{background:var(--danger-soft);color:var(--danger);}
  .st.short{background:#fef3e2;color:#a35f00;}
  .st.wait{background:var(--bg);color:var(--ink-mute);}
  .rc-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);padding:6px 16px 0;}
  .rc-foot b{color:var(--insp);}
  .rc-hint{font-size:11px;color:var(--ink-mute);padding:4px 16px 12px;}
  .rc-legacy{margin:12px 16px 0;font-size:11.5px;color:var(--ink-soft);background:#fef3e2;border:1px solid #f3dcb8;border-radius:7px;padding:8px 11px;}
  .rc-legacy ul{margin:4px 0 0 16px;}
  /* 최종 확인 모달 — 입고 현황·미입고 사유 입력 단계 */
  .ov-ok{margin-top:14px;text-align:left;font-size:11.5px;color:#1d6b40;background:var(--ok-soft);border:1px solid #bfe3cd;border-radius:7px;padding:8px 11px;}
  .rs-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;text-align:left;}
  .rs-row .n{font-weight:700;}
  .rs-row .q{color:#a35f00;font-weight:700;margin-left:6px;}
  .rs-row input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit;margin-top:3px;}
  .rs-row input.need{border-color:var(--danger);background:#fff8f8;}

  /* 결재란 — 기존 Form 패턴 */
  .appr-wrap{padding:12px 16px 10px;overflow-x:auto;}
  .appr-table{border-collapse:collapse;}
  .appr-table th{background:#f0f0f0;font-size:10px;font-weight:700;color:#444;padding:4px 6px;border:1px solid #ccc;text-align:center;min-width:110px;}
  .appr-table td{border:1px solid #ccc;padding:3px 6px;font-size:11px;text-align:center;}
  .appr-table td.bg{background:#f7f7f7;font-size:10px;color:#666;padding:4px 10px;font-weight:700;}
  .trig{font-size:11px;color:#aaa;cursor:pointer;padding:4px 6px;display:block;width:100%;}
  .trig.sel{color:var(--insp);font-weight:600;background:var(--insp-soft);border-radius:4px;}
  .sub{font-size:10px;color:#666;}
  .delb{background:none;border:none;cursor:pointer;color:#c0392b;font-size:14px;line-height:1;font-family:inherit;}
  .delb:disabled{color:#ccc;cursor:not-allowed;}
  .addb{font-size:11px;color:var(--insp);background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit;font-weight:600;}
  .addb:hover{text-decoration:underline;}
  .dd{position:fixed;z-index:9999;background:#fff;border:1px solid #ccc;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:260px;max-height:240px;overflow-y:auto;}
  .dd-s{padding:6px 8px;border-bottom:1px solid #eee;}
  .dd-s input{width:100%;border:1px solid #ccc;border-radius:4px;padding:4px 8px;font-size:11px;font-family:inherit;outline:none;}
  .dd-i{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-bottom:1px solid #f5f5f5;}
  .dd-i:hover{background:#f5f5f5;}
  .dd-av{width:24px;height:24px;border-radius:50%;background:var(--insp-soft);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--insp);flex-shrink:0;}
  .dd-n{font-size:12px;font-weight:600;color:#111;}
  .dd-m{font-size:10px;color:#888;}
  .dd-e{padding:12px;text-align:center;font-size:11px;color:#aaa;}

  .actions{display:flex;gap:10px;justify-content:center;margin:24px 0 8px;}
  .btn{border:none;border-radius:7px;padding:9px 18px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.insp{background:var(--insp);color:#fff;}
  .btn.insp:hover{filter:brightness(1.08);}
  .btn.gray{background:#fff;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.primary{background:var(--accent);color:#fff;}
  /* 반려 후 폐기 (제출자 본인에게만 노출) — 외곽선 버튼, 확인 모달 안에서는 채운 버튼 */
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #f3c0c0;}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.danger-fill{background:var(--danger);color:#fff;}
  .btn.danger-fill:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5;cursor:default;}

  /* 홈으로 버튼 (우측 상단 고정) — Form과 동일 */
  .home-btn{position:fixed;top:16px;right:20px;z-index:5000;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:1px solid #83161A;background:#fff;color:#83161A;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(131,22,26,.18);transition:background .15s,color .15s;}
  .home-btn:hover{background:#83161A;color:#fff;}

  .loading{text-align:center;padding:60px 20px;color:var(--ink-mute);}
  .spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--insp);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err-box{background:var(--danger-soft);border:1px solid #f3c0c0;border-radius:9px;padding:18px;color:var(--danger);font-size:13px;}

  .overlay{position:fixed;inset:0;background:rgba(20,22,28,.5);display:none;align-items:center;justify-content:center;z-index:9000;padding:16px;}
  .overlay.on{display:flex;}
  .ov-card{background:#fff;border-radius:12px;padding:28px 32px;text-align:center;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.3);word-break:keep-all;overflow-wrap:break-word;max-height:100%;overflow-y:auto;}
  .ov-card .spinner{margin-bottom:16px;}
  .ov-msg{font-size:13.5px;font-weight:600;color:var(--ink);}
  .ov-sub{font-size:11.5px;color:var(--ink-mute);margin-top:6px;}
  .ok-icon{width:48px;height:48px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;}
  /* 확인·경고도 같은 오버레이 카드로 띄운다 — 브라우저 confirm/alert/토스트 금지 (전 화면 공통: 모달 + 백그라운드) */
  .x-icon{width:48px;height:48px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 14px;}
  .q-icon{width:48px;height:48px;border-radius:50%;background:var(--insp-soft);color:var(--insp);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 14px;}
  .ov-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;}
  .ov-warn{margin-top:14px;text-align:left;font-size:11.5px;color:var(--ink-soft);background:#fef3e2;border:1px solid #f3dcb8;border-radius:7px;padding:8px 11px;}
  .ov-warn b{color:#a35f00;}
  .fin-opts{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .fin-opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .fin-opt:hover{border-color:var(--insp);background:var(--insp-soft);}
  .fin-opt b{display:block;font-size:13px;}
  .fin-opt span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.45;}

  /* 인쇄 — 품의/구매 화면과 동일 (A4 세로, 화면 전용 요소 숨김) */
  @media print{
    body{background:#fff;padding:0;}
    .topbar,.home-btn,.actions,.pz,.notice,.overlay,.addb,.delb,.pi .d,.rc-hint,.rc-foot{display:none!important;}
    .wrap{max-width:none;margin:0;padding:0;}
    .sec{break-inside:avoid;}
    input,select,textarea{border:none!important;background:transparent!important;}
    @page{size:A4 portrait;margin:10mm;}
  }
</style>
</head>
<body>
<button class="home-btn" id="home-btn" onclick="goHome()">🏠 홈으로</button>
<div class="topbar">
  <div><div class="t">검수보고서 작성</div><div class="s">InLC Technology · 구매결재시스템</div></div>
</div>

<div class="wrap" id="wrap">
  <div class="loading"><div class="spinner"></div>품의 정보를 불러오는 중...</div>
</div>

<div class="overlay" id="overlay"><div class="ov-card" id="ov-card"></div></div>

<script>
// 서버 주입 변수
var PRC_TOKEN   = '<?= prcToken ?>';
var RESUB_TOKEN = '<?= resubToken ?>';
var WEBAPP_URL  = '<?= webappUrl ?>';

var FORM = null, APPROVERS = [], CURRENT_USER = null, RESUB = null;
// [v1.1] 품목별 입고 — 서버가 준 PRC 품목(발주·기입고·잔량)과 레거시 회차. itemsUnavailable이면 자유 텍스트 폴백
var RECEIPT = null;
var STATE = { verdict:'', isFinal:false, photos:[], appr:[null,null,null], rc:[] };
// 검수 사진 한도 — 서버 INSP.gs의 INSP_PHOTO_MAX_COUNT / INSP_PHOTO_MAX_TOTAL과 같은 값 (합계는 줄인 사본 기준)
var PHOTO_MAX_COUNT = 6;
var PHOTO_MAX_TOTAL = 15 * 1024 * 1024;
var DD = { el:null, slot:-1 };

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function goHome(){
  try { window.top.location.href = WEBAPP_URL; }
  catch(e) {
    // 샌드박스에서 top 접근이 막히면 현재 컨텍스트로 이동 시도
    try { window.open(WEBAPP_URL, '_top'); }
    catch(e2) { location.href = WEBAPP_URL; }
  }
}
function pad2(n){n=parseInt(n)||0;return n<10?'0'+n:String(n);}

// ── 부팅 ──
function boot(){
  if(typeof google==='undefined'){
    document.getElementById('wrap').innerHTML='<div class="err-box">Apps Script 환경에서만 실행 가능합니다.</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||!res.ok){
        document.getElementById('wrap').innerHTML='<div class="err-box">'+esc(res?res.message:'데이터를 불러올 수 없습니다.')+'</div>';
        return;
      }
      FORM=res.form; APPROVERS=res.approverList||[]; CURRENT_USER=res.currentUser||null; RESUB=res.resub||null;
      RECEIPT=res.receipt||null;
      if(RESUB){
        STATE.verdict=RESUB.verdict||''; STATE.isFinal=!!RESUB.isFinal;
      }
      initReceipt();
      render();
    })
    .withFailureHandler(function(err){
      document.getElementById('wrap').innerHTML='<div class="err-box">서버 오류: '+esc(err&&err.message?err.message:err)+'</div>';
    })
    .getInspFormDataForClient(PRC_TOKEN, RESUB_TOKEN||null);
}

function render(){
  var f=FORM, me=CURRENT_USER||{};
  var html='';

  // 1. 기본 정보
  html+='<div class="sec"><div class="sec-h"><span class="dot"></span>기본 정보'
    + (RESUB?' <span style="font-weight:400;color:var(--danger);font-size:11px;">— 반려 후 재상신('+f.nextSeq+'회차)</span>':'')
    + '</div><div class="grid">'
    + row('문서 번호', f.docNo, '품의번호+회차 자동')
    + row('담당자', esc(f.drafterName)+' ('+esc(f.dept)+')', '자동')
    + row('품의 번호', esc(f.reqNo), '')
    + row('PO 번호', esc(f.poNo), '')
    + row('품명', esc(f.subject), '')
    + row('업체명', esc(f.vendorName), '')
    + row('기안 일자', esc(f.issueDate), '')
    + '<div class="lbl">입고 일자 *</div><div class="val"><input type="date" id="f-received" value="'+esc(RESUB?RESUB.receivedDate:today())+'"></div>'
    // 입고 내역 한 줄 입력은 품목 표로 대체됐다(v1.1). 품목내역을 해석할 수 없는 옛 품의에서만 폴백으로 남긴다.
    + (rcMode()?'':'<div class="lbl">입고 내역 *</div><div class="val span3"><input type="text" id="f-note" maxlength="200" placeholder="이번 회차 입고 품목·수량 (예: 지그 본체 2EA — 2차분)" value="'+esc(RESUB?RESUB.receivedNote:'')+'"></div>')
    + '</div></div>';

  // 1-1. 입고 품목 (v1.1) — PRC 품목별 이번 회차 입고 수량
  html+=renderReceiptSection();

  // 2. 검수 결과
  html+='<div class="sec"><div class="sec-h"><span class="dot"></span>검수 결과</div><div class="body">'
    + '<div class="verdict-row">'
    +   '<div class="verdict pass'+(STATE.verdict==='합격'?' sel':'')+'" onclick="setV(\'합격\')">✓ 합격</div>'
    +   '<div class="verdict fail'+(STATE.verdict==='불합격'?' sel':'')+'" onclick="setV(\'불합격\')">✕ 불합격</div>'
    + '</div>'
    + '<textarea id="f-comment" placeholder="검수 의견 (예: 외관·치수 전수 검수, 이상 없음)">'+esc(RESUB?RESUB.comment:'')+'</textarea>'
    + '<div class="pz" onclick="document.getElementById(\'f-photos\').click()"'
    +      ' ondragover="event.preventDefault();this.classList.add(\'dragover\');"'
    +      ' ondragleave="this.classList.remove(\'dragover\');"'
    +      ' ondrop="event.preventDefault();this.classList.remove(\'dragover\');addPhotos(event.dataTransfer.files);">'
    +   '📷 클릭하거나 사진을 이곳에 끌어놓아 추가 — 최대 '+PHOTO_MAX_COUNT+'장 (원본 크기 제한 없음 · 첨부할 때 자동으로 줄여서 올립니다)</div>'
    + '<input type="file" id="f-photos" accept="image/*" multiple style="display:none" onchange="addPhotos(this.files)">'
    + '<div class="pg" id="pg"></div>'

// ── [v1.1] 입고 품목 표 ──
// STATE.rc[i] = {idx, checked, qty, reason} — RECEIPT.items[i]와 같은 순서(idx = 품의 품목내역 행 번호)
var RC_ST={over:'초과',done:'완료',short:'미입고',part:'부분',wait:'대기'};
function rcMode(){ return !!(RECEIPT && !RECEIPT.itemsUnavailable && (RECEIPT.items||[]).length); }
function initReceipt(){
  STATE.rc=[];
  if(!rcMode()) return;
  STATE.rc=RECEIPT.items.map(function(it){ return {idx:it.idx, checked:false, qty:0, reason:''}; });
  // 재상신: 반려된 회차의 수량·사유를 그대로 채운다 (기입고는 서버가 본인 행을 빼고 다시 계산해 줬다)
  if(RESUB && RESUB.receipt && RESUB.receipt.items){
    RESUB.receipt.items.forEach(function(p){
      var l=STATE.rc[p.idx]; if(!l) return;
      l.qty=parseInt(p.qty,10)||0; l.reason=String(p.reason||''); l.checked=l.qty>0||!!l.reason;
    });
  }
}
function renderReceiptSection(){

  if((RECEIPT.legacyRounds||[]).length){

      + RECEIPT.legacyRounds.map(function(r){ return '<li>'+esc(r.docNo)+' · '+esc(r.receivedDate)+' · '+esc(r.receivedNote)+' ('+esc(r.status)+')</li>'; }).join('')
      + '</ul></div>';
  }
  if(RECEIPT.snapshotMismatch || RECEIPT.orphanQty>0){
    h+='<div class="rc-legacy">⚠ 발주 수량이 이전 회차 기록과 다릅니다(품의 수량 정정). 기입고·잔량은 현재 품의 수량 기준입니다.'
      + (RECEIPT.orphanQty>0?' (삭제된 품목의 입고분 '+RECEIPT.orphanQty+')':'')+'</div>';
  }
  h+='<div class="rc-wrap"><table class="rc" id="rc-table"><thead><tr>'
    + '<th><input type="checkbox" id="rc-all" title="전체 선택" aria-label="전체 선택" onchange="rcToggleAll(this.checked)"></th>'
    + '<th>No</th><th class="l">품명</th><th>규격</th><th>발주</th><th>기입고</th><th>잔량</th><th>이번 입고</th><th class="l">수량 상이 사유</th><th>상태</th>'
    + '</tr></thead><tbody id="rc-body"></tbody></table></div>'
    + '<div class="rc-foot"><div id="rc-sum"></div><div>체크하면 잔량이 자동 입력되고 수정할 수 있습니다</div></div>'
    + '<div class="rc-hint">초과 입고(누계 &gt; 발주)는 해당 행의 사유를 적어야 제출됩니다. 최종 검수를 체크하면 잔량이 남는 행에 미입고 종결 사유 칸이 열립니다.</div>'
    + '</div>';
  return h;
}
function rcState(i){
  var it=RECEIPT.items[i], l=STATE.rc[i], cum=it.prev+l.qty;
  if(cum>it.ordered) return 'over';
  if(cum===it.ordered) return 'done';
  return STATE.isFinal?'short':(l.qty>0?'part':'wait');
}
// 초과는 이번 회차 입고분이 있을 때만 사유 (이전 회차에서 이미 초과된 품목의 0 입고는 묻지 않음 — 서버 규칙과 동일)
function rcNeedReason(i){ var s=rcState(i); return (s==='over'&&STATE.rc[i].qty>0)||s==='short'; }
function rcPlaceholder(i){ var s=rcState(i); return rcNeedReason(i)?(s==='over'?'초과 입고 사유 (필수)':'미입고 종결 사유 (필수)'):'-'; }
function drawReceipt(){
  var tb=document.getElementById('rc-body'); if(!tb||!rcMode()) return;
  tb.innerHTML=RECEIPT.items.map(function(it,i){
    var l=STATE.rc[i], s=rcState(i), need=rcNeedReason(i);
    return '<tr'+(it.remaining===0&&l.qty===0?' class="done"':'')+'>'
      + '<td><input type="checkbox" class="rc-chk" id="rc-chk-'+i+'"'+(l.checked?' checked':'')+' onchange="rcSetChecked('+i+',this.checked)" aria-label="'+esc(it.name)+' 선택"></td>'
      + '<td>'+(i+1)+'</td><td class="l nm">'+esc(it.name)+'</td><td>'+esc(it.spec)+'</td>'
      + '<td class="num">'+it.ordered+'</td><td>'+it.prev+'</td><td class="remain">'+it.remaining+'</td>'
      + '<td><input type="number" min="0" step="1" inputmode="numeric" class="rc-qty" id="rc-qty-'+i+'" value="'+l.qty+'"'+(l.checked?'':' disabled')+' oninput="rcOnQty('+i+',this.value)" aria-label="이번 입고 수량"></td>'
      + '<td class="l"><input type="text" class="rc-reason'+(need&&!l.reason?' need':'')+'" id="rc-rs-'+i+'" maxlength="200" value="'+esc(l.reason)+'"'+(need?'':' disabled')+' placeholder="'+rcPlaceholder(i)+'" oninput="rcOnReason('+i+',this.value)" aria-label="수량 상이 사유"></td>'
      + '<td><span class="st '+s+'" id="rc-st-'+i+'">'+RC_ST[s]+'</span></td></tr>';
  }).join('');
  rcSummary();
}
function rcSetChecked(i,on){ var it=RECEIPT.items[i], l=STATE.rc[i]; l.checked=on; l.qty=on?it.remaining:0; if(!on) l.reason=''; drawReceipt(); }
function rcToggleAll(on){ STATE.rc.forEach(function(l,i){ var it=RECEIPT.items[i]; l.checked=on; l.qty=on?it.remaining:0; if(!on) l.reason=''; }); drawReceipt(); }
function rcOnQty(i,v){ var n=parseInt(v,10); STATE.rc[i].qty=(v===''||isNaN(n)||n<0)?0:n; rcUpdateRow(i); }
function rcOnReason(i,v){ STATE.rc[i].reason=String(v||'').trim(); var el=document.getElementById('rc-rs-'+i); if(el) el.classList.toggle('need', rcNeedReason(i)&&!STATE.rc[i].reason); }
// 수량 입력 중에는 행만 갱신한다 (전체 재렌더는 포커스를 잃는다)
function rcUpdateRow(i){
  var s=rcState(i), need=rcNeedReason(i), l=STATE.rc[i];
  var st=document.getElementById('rc-st-'+i); if(st){ st.className='st '+s; st.textContent=RC_ST[s]; }
  var rs=document.getElementById('rc-rs-'+i); if(rs){ rs.disabled=!need; rs.placeholder=rcPlaceholder(i); rs.classList.toggle('need', need&&!l.reason); }
  rcSummary();
}
function rcSummary(){
  var el=document.getElementById('rc-sum'); if(!el) return;
  var n=0, done=0;
  RECEIPT.items.forEach(function(it,i){ var l=STATE.rc[i]; if(l.qty>0) n++; if(it.prev+l.qty>=it.ordered) done++; });
  el.innerHTML='이번 회차 입고 <b>'+n+'</b>개 품목 · 반영 후 완료 <b>'+done+'</b>/'+RECEIPT.items.length+' 품목';
  var all=document.getElementById('rc-all'); if(all) all.checked=STATE.rc.length>0&&STATE.rc.every(function(l){return l.checked;});
}
// 이번 회차 반영 후 현황 — 제출 검증·최종 확인 모달 공용
function rcAnalysis(){
  var over=[], short=[], anyQty=false, doneN=0;
  RECEIPT.items.forEach(function(it,i){
    var l=STATE.rc[i], cum=it.prev+l.qty;
    if(l.qty>0) anyQty=true;
    if(cum>it.ordered) over.push({it:it,l:l,cum:cum});
    else if(cum<it.ordered) short.push({it:it,l:l,cum:cum});
    else doneN++;
  });
  return {over:over, short:short, anyQty:anyQty, doneN:doneN, total:RECEIPT.items.length, allDone:short.length===0&&over.length===0};
}
function rcPayloadItems(){ return STATE.rc.map(function(l){ return {idx:l.idx, qty:l.qty, reason:l.reason}; }); }

// ── 사진 (canvas 압축) ──
// 원본 크기는 보지 않는다 — 고르는 즉시 긴 변 1600px·JPEG 80%로 줄이고, 줄인 사본의 합계만 제한한다.
//  (예전 '장당 5MB'는 압축 전 원본에 걸려, 줄이면 수백 KB인 휴대폰 사진까지 막았다 — 2026-10-30)
// 순서: 고른 순서대로 자리(pending)를 먼저 잡고 압축이 끝나면 채운다. 압축은 끝나는 순서가 제각각이라
//  끝난 순서대로 쌓으면 PDF 사진 순서가 고른 순서와 달라졌다.
function addPhotos(files){
  var remain=PHOTO_MAX_COUNT-STATE.photos.length, warns=[];
  // 드래그앤드롭은 accept="image/*" 필터를 우회하므로 이미지 여부를 직접 검사
  var imgs=Array.from(files).filter(function(file){
    if(file.type && file.type.indexOf('image/')!==0){warns.push('"'+file.name+'" — 이미지 파일만 첨부할 수 있습니다.');return false;}
    return true;
  });
  if(imgs.length>remain) warns.push('사진은 최대 '+PHOTO_MAX_COUNT+'장까지 첨부 가능합니다.');
  var batch=imgs.slice(0,Math.max(remain,0)).map(function(file){
    var slot={name:file.name.replace(/\.[^.]+$/,'.jpg'),size:0,dataUrl:'',pending:true};
    STATE.photos.push(slot);
    return {file:file,slot:slot};
  });
  // 여러 파일이 한꺼번에 걸려도 모달 한 장에 모아 보여준다 (토스트처럼 앞 메시지를 덮어쓰지 않도록)
  //  압축 실패·합계 초과는 압축이 끝나야 알 수 있으므로 이번에 고른 사진이 모두 끝난 뒤에 띄운다.
  function report(){ if(warns.length) showAlertModal('일부 파일을 첨부하지 못했습니다.', warns); }
  drawPhotos();
  if(!batch.length){ report(); return; }
  var left=batch.length;
  batch.forEach(function(b){
    compressImage(b.file,function(dataUrl,blobSize){
      var i=STATE.photos.indexOf(b.slot);
      if(i>=0){
        if(!dataUrl){
          STATE.photos.splice(i,1);
          warns.push('"'+b.file.name+'" — 사진을 열 수 없습니다. 아이폰 HEIC처럼 브라우저가 읽지 못하는 형식이면 JPG로 바꿔 다시 첨부해 주세요.');
        } else if(photoBytes()+blobSize>PHOTO_MAX_TOTAL){
          STATE.photos.splice(i,1);
          warns.push('"'+b.file.name+'" — 사진 합계가 '+(PHOTO_MAX_TOTAL/1048576)+'MB를 넘어 제외되었습니다.');
        } else {
          b.slot.size=blobSize; b.slot.dataUrl=dataUrl; b.slot.pending=false;
        }
      }
      drawPhotos();
      if(--left===0) report();
    });
  });
}
// 줄인 사본의 합계 (처리 중인 자리는 0)
function photoBytes(){ return STATE.photos.reduce(function(s,p){ return s+(p.pending?0:p.size); },0); }
// 결과는 cb(dataUrl, 바이트) — 읽지 못하면 cb(null, 0)
function compressImage(file,cb){
  var reader=new FileReader();
  reader.onerror=function(){cb(null,0);};
  reader.onload=function(e){
    var img=new Image();
    // HEIC 등 브라우저가 그리지 못하는 형식 — 예전엔 onload가 오지 않아 첨부도 경고도 없이 사라졌다
    img.onerror=function(){cb(null,0);};
    img.onload=function(){
      try{
        var max=1600, w=img.width, h=img.height;
        if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
        var canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        var dataUrl=canvas.toDataURL('image/jpeg',0.8);
        var size=Math.round((dataUrl.length-dataUrl.indexOf(',')-1)*3/4);
        cb(dataUrl,size);
      }catch(err){ cb(null,0); }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function drawPhotos(){
  var g=document.getElementById('pg'); if(!g)return;
  g.innerHTML=STATE.photos.map(function(p,i){
    if(p.pending) return '<div class="pi"><div class="wait">사진 줄이는 중…</div><div class="m">'+esc(p.name)+'</div></div>';
    return '<div class="pi"><img src="'+p.dataUrl+'"><button class="d" onclick="STATE.photos.splice('+i+',1);drawPhotos()">✕</button><div class="m">'+esc(p.name)+' · '+(p.size/1024).toFixed(0)+'KB</div></div>';
  }).join('');
}

function openDd(slot,trig){
  closeDd(); DD.slot=slot;
  var dd=document.createElement('div'); dd.className='dd';
  var r=trig.getBoundingClientRect();
  dd.style.top=(r.bottom+4)+'px'; dd.style.left=r.left+'px';
  dd.innerHTML='<div class="dd-s"><input type="text" id="dd-in" placeholder="이름 또는 부서 검색..." autocomplete="off"></div><div id="dd-list"></div>';
  document.body.appendChild(dd); DD.el=dd;
  var inp=document.getElementById('dd-in');
  inp.addEventListener('input',function(){ddList(this.value);});
  ddList('');
  setTimeout(function(){inp.focus();},50);
  setTimeout(function(){document.addEventListener('click',function oc(e){if(DD.el&&!DD.el.contains(e.target)&&e.target!==trig){closeDd();document.removeEventListener('click',oc);}});},100);
}
function closeDd(){if(DD.el){DD.el.remove();DD.el=null;DD.slot=-1;}}
function ddList(q){
  var list=document.getElementById('dd-list'); if(!list)return;
  q=(q||'').toLowerCase();
  // REQ/PRC 동일: 본인·중복 제외하지 않음 (기안자=결재자 본인 허용, 위임 케이스 허용)
  var f=APPROVERS.filter(function(p){
    if(!p.active) return false;
    return !q||(p.name||'').toLowerCase().indexOf(q)>=0||(p.dept||'').toLowerCase().indexOf(q)>=0;
  });
  if(f.length===0){list.innerHTML='<div class="dd-e">검색 결과가 없습니다.</div>';return;}
  list.innerHTML=f.map(function(p){
    return '<div class="dd-i" onclick="pickAppr(\''+esc(p.email)+'\')"><div class="dd-av">'+esc((p.name||'?').substring(0,1))+'</div><div><div class="dd-n">'+esc(p.name)+'</div><div class="dd-m">'+esc(p.dept+' · '+p.rank+' · '+p.email)+'</div></div></div>';
  }).join('');
}
function pickAppr(email){
  var p=APPROVERS.find(function(x){return x.email===email;});

// ── 제출 ──
function submit(){
  if(STATE.verdict!=='합격'&&STATE.verdict!=='불합격'){showAlertModal('검수 판정(합격/불합격)을 선택해 주세요.');return;}
  // [v1.1] 입고 품목: 초과 입고 사유 누락은 여기서 막는다. 입고 합계 0·미입고 사유는 최종/중간 선택에 따라 모달에서 가른다.
  var fallbackNote='';
  if(rcMode()){
    var an=rcAnalysis();
    var missOver=an.over.filter(function(o){return o.l.qty>0&&!o.l.reason;});
    if(missOver.length){
      showAlertModal('초과 입고 품목의 수량 상이 사유를 입력해 주세요.', missOver.map(function(o){ return (o.it.idx+1)+'. '+o.it.name+' — 누계 '+o.cum+'/'+o.it.ordered; }));
      return;
    }
  } else {
    var noteEl=document.getElementById('f-note');
    fallbackNote=noteEl?noteEl.value.trim():'';
    if(!fallbackNote){showAlertModal('입고 내역을 입력해 주세요.');return;}
  }
  var sels=STATE.appr.filter(Boolean);
  if(sels.length===0){showAlertModal('결재자를 1명 이상 지정해 주세요.');return;}
  var lastFilled=-1; STATE.appr.forEach(function(a,i){if(a)lastFilled=i;});
  for(var k=0;k<lastFilled;k++){ if(!STATE.appr[k]){showAlertModal('결재자 '+(k+1)+' 칸이 비어 있습니다. 순서대로 채워 주세요.');return;} }
  if(STATE.photos.some(function(p){return p.pending;})){showAlertModal('사진을 줄이는 중입니다. 잠시 후 다시 눌러 주세요.');return;}

  // approvers[0]=기안자(제출 본인, 자기결재), [1..]=결재자 — REQ/PRC 동일 구조
  // 검수보고서의 기안자 = 실제 제출자(로그인 사용자). 원본 REQ 기안자와 다를 수 있음(같은 부서 대리 제출 허용).
  var approvers=[{
    label:'기안자',
    name:(CURRENT_USER&&CURRENT_USER.name)||FORM.drafterName,
    email:(CURRENT_USER&&CURRENT_USER.email)||FORM.drafterEmail
  }];
  sels.forEach(function(a,i){ approvers.push({label:'결재자 '+(i+1), name:a.name, email:a.email}); });

  // 결재자 중복 배정 경고 (REQ/PRC 동일 — 의도된 본인/위임 케이스는 허용, 실수만 잡음)
  var seen={}, dups=[];
  approvers.forEach(function(ap){
    var em=(ap.email||'').toLowerCase(); if(!em)return;
    if(seen[em]) dups.push(ap.name||em); else seen[em]=true;
  });
  // 입력값은 제출 버튼을 누른 시점으로 고정한다 (분리 전과 동일). 최종 여부만 아래 모달에서 다시 받는다.
  var payload={
    prcToken:PRC_TOKEN, resubToken:RESUB_TOKEN||'',
    receivedDate:document.getElementById('f-received').value,
    verdict:STATE.verdict,
    isFinal:STATE.isFinal,
    comment:document.getElementById('f-comment').value,
    approvers:approvers,
    photos:STATE.photos.map(function(p){return {name:p.name,size:p.size,type:'image/jpeg',data:p.dataUrl.split(',')[1]};}),
  };
  // [v1.1] 입고 내역 한 줄 대신 품목별 수량. 품목내역을 해석할 수 없는 옛 품의만 자유 텍스트(폴백)
  if(rcMode()) payload.receiptItems=rcPayloadItems();
  else payload.receivedNoteFallback=fallbackNote;

  // 사진 없음·결재자 중복은 따로 묻지 않고 최종 확인 모달 한 장에 함께 보여준다
  var warns=[];
  if(STATE.photos.length===0) warns.push('첨부된 검수 사진이 없습니다.');
  if(dups.length>0) warns.push('동일한 결재자가 여러 단계에 배정되어 있습니다: '+dups.join(', ')+' (기안자 본인을 결재자로 지정한 경우일 수 있습니다)');
  showFinalCheckModal(warns, function(isFinal){
    // 모달 선택이 최종값 — 체크박스도 맞춰 둔다 (제출 실패 후 화면이 실제 제출값과 어긋나지 않도록)
    STATE.isFinal=isFinal;
    var cb=document.getElementById('f-final'); if(cb) cb.checked=isFinal;
    payload.isFinal=isFinal;
    if(rcMode()){ drawReceipt(); payload.receiptItems=rcPayloadItems(); }   // 모달 2단계에서 적은 미입고 사유 반영
    sendSubmit(payload);
  });
}

function sendSubmit(payload){
  showOverlay('제출 처리 중...', '검수보고서를 기록하고 사진을 업로드하고 있습니다.');
  document.getElementById('submit-btn').disabled=true;

  google.script.run
    .withSuccessHandler(function(res){
      if(res&&res.ok){
        showSuccess(res);
      }else{
        document.getElementById('submit-btn').disabled=false;
        // 서버 검증 메시지는 품목별 한 줄씩(\n) 올 수 있다
        showAlertModal('제출에 실패했습니다.', String(res&&res.message?res.message:'알 수 없는 오류').split('\n'));
      }
    })
    .withFailureHandler(function(err){
      document.getElementById('submit-btn').disabled=false;
      showAlertModal('제출에 실패했습니다.', '네트워크 오류: '+(err&&err.message?err.message:err));
    })
    .submitInspForClient(payload);
}

// 제출 직전 최종 확인 — 체크박스와 관계없이 매번 '최종 / 중간'을 직접 고르게 한다.
// 2026-09-23 TO-PO-26-253·258·259 세 건이 '최종 검수' 체크 없이 제출돼 isFinal을 소급 보정했다 (재발 방지).
// 기본 선택은 두지 않는다: 포커스를 빼서 Enter로 넘어가지 않고, 두 버튼 중 하나를 눌러야 제출된다.
// [v1.1] 품목별 입고 현황을 같은 카드에 보여준다: 잔량이 남은 채 '최종'을 고르면 같은 창에서 미입고 사유를 받고,
//  입고 수량이 전부 0이면 '중간'은 막는다(종결 전용 회차는 최종만 가능). 전 품목 완료인데 '중간'이면 한 번 되묻는다.
function showFinalCheckModal(warns, onChoose){
  var ctx=rcMode()?rcAnalysis():null;
  var html='<div class="q-icon">?</div>'
    + '<div class="ov-msg">이번 회차가 최종 검수입니까?</div>'
    + '<div class="ov-sub">'+esc(FORM.docNo)+' · '+esc(FORM.nextSeq)+'회차 · '+esc(STATE.verdict)+'</div>';
  if(ctx){
    html+='<div class="'+(ctx.allDone?'ov-ok':'ov-warn')+'" id="fin-status"><b>이번 회차 반영 후 입고 현황</b> — 완료 '+ctx.doneN+'/'+ctx.total+' 품목'
      + (ctx.anyQty?'':'<div>· 이번 회차 입고 수량이 없습니다 (종결 전용 회차)</div>')
      + ctx.short.map(function(o){ return '<div>· 미입고 — '+(o.it.idx+1)+'. '+esc(o.it.name)+' 잔량 '+(o.it.ordered-o.cum)+'</div>'; }).join('')
      + ctx.over.map(function(o){ return '<div>· 초과 — '+(o.it.idx+1)+'. '+esc(o.it.name)+' 누계 '+o.cum+'/'+o.it.ordered+(o.l.reason?' ('+esc(o.l.reason)+')':(o.l.qty>0?'':' (이전 회차 초과분)'))+'</div>'; }).join('')
      + (ctx.allDone?'<div>· 모든 품목이 발주 수량만큼 입고됩니다 — 최종 검수를 권장합니다</div>':'')
      + '</div>';
  }
  if(warns.length){
    html+='<div class="ov-warn"><b>제출 전 확인</b>'+warns.map(function(w){return '<div>· '+esc(w)+'</div>';}).join('')+'</div>';
  }
  html+='<div class="fin-opts">'
    + '<button class="fin-opt" id="fin-yes"><b>예 — 최종 검수로 제출</b><span>이번 입고로 납품이 끝났습니다. 결재가 완료되면 품의가 검수 완료(종결)되고 추가 제출이 차단됩니다.'
    + (ctx&&ctx.short.length?' 잔량 품목의 미입고 사유를 다음 단계에서 입력합니다.':'')+'</span></button>'
    + '<button class="fin-opt" id="fin-no"><b>아니요 — 중간 회차로 제출</b><span>남은 입고분이 있습니다. 이후 회차의 검수보고서를 이어서 제출할 수 있습니다.</span></button>'
    + '</div>'
    + '<div class="ov-actions"><button class="btn gray" id="fin-cancel">취소</button></div>';
  document.getElementById('ov-card').innerHTML=html;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('fin-yes').onclick=function(){
    if(ctx && ctx.short.some(function(o){return !o.l.reason;})){ showShortReasonStep(ctx, onChoose); return; }
    onChoose(true);
  };
  document.getElementById('fin-no').onclick=function(){
    if(ctx && !ctx.anyQty){ showAlertModal('입고 수량이 없는 회차는 중간 회차로 제출할 수 없습니다.', ['입고 없이 종결하려면 최종 검수로 제출해 주세요.']); return; }
    if(ctx && ctx.allDone){ showAllDoneConfirm(function(){ onChoose(false); }); return; }
    onChoose(false);
  };
  document.getElementById('fin-cancel').onclick=hideOverlay;
  if(document.activeElement) document.activeElement.blur();
}

// 최종 검수인데 잔량이 남은 품목 — 품목마다 미입고 종결 사유를 받는다 (전부 채워야 제출 버튼 활성)
function showShortReasonStep(ctx, onChoose){
  var html='<div class="q-icon">?</div>'
    + '<div class="ov-msg">미입고 품목의 종결 사유를 입력해 주세요</div>'
    + '<div class="ov-sub">최종 검수로 제출하면 아래 잔량은 입고되지 않은 채 종결됩니다</div>'
    + '<div class="rs-list">';
  ctx.short.forEach(function(o){
    html+='<div class="rs-row"><div><span class="n">'+(o.it.idx+1)+'. '+esc(o.it.name)+'</span><span class="q">잔량 '+(o.it.ordered-o.cum)+'</span></div>'
      + '<input type="text" id="rs-in-'+o.it.idx+'" maxlength="200" value="'+esc(o.l.reason)+'" placeholder="예: 생산 취소 · 주문 취소(업체 통보 11/3)" class="'+(o.l.reason?'':'need')+'"></div>';
  });
  html+='</div><div class="ov-actions"><button class="btn gray" id="rs-back">돌아가기</button><button class="btn insp" id="rs-ok">최종 검수로 제출</button></div>';
  document.getElementById('ov-card').innerHTML=html;
  var ok=document.getElementById('rs-ok');
  function refresh(){
    var all=true;
    ctx.short.forEach(function(o){
      var inp=document.getElementById('rs-in-'+o.it.idx), v=inp.value.trim();
      STATE.rc[o.it.idx].reason=v; inp.classList.toggle('need',!v); if(!v) all=false;
    });
    ok.disabled=!all;
  }
  ctx.short.forEach(function(o){ document.getElementById('rs-in-'+o.it.idx).addEventListener('input', refresh); });
  refresh();
  document.getElementById('rs-back').onclick=function(){ hideOverlay(); drawReceipt(); };
  ok.onclick=function(){ if(ok.disabled) return; onChoose(true); };
  if(document.activeElement) document.activeElement.blur();
}

// 전 품목이 발주 수량만큼 채워지는데 '중간 회차'를 고른 경우 — 한 번 되묻는다
function showAllDoneConfirm(onYes){
  document.getElementById('ov-card').innerHTML='<div class="q-icon">?</div>'
    + '<div class="ov-msg">모든 품목이 발주 수량만큼 입고되는데 중간 회차로 제출합니다.</div>'
    + '<div class="ov-sub">최종 검수로 제출하지 않으면 품의가 종결되지 않고 다음 회차를 계속 받을 수 있는 상태로 남습니다.</div>'
    + '<div class="ov-actions"><button class="btn gray" id="ad-back">돌아가기</button><button class="btn insp" id="ad-ok">중간 회차로 제출</button></div>';
  document.getElementById('ad-back').onclick=hideOverlay;
  document.getElementById('ad-ok').onclick=onYes;
  if(document.activeElement) document.activeElement.blur();
}

// 경고·오류 — 브라우저 alert/토스트 대신 같은 오버레이 카드에 띄운다. detail은 문자열 또는 줄 배열.
function showAlertModal(msg, detail){
  var lines=Array.isArray(detail)?detail:(detail?[detail]:[]);
  document.getElementById('ov-card').innerHTML='<div class="x-icon">!</div>'
    + '<div class="ov-msg">'+esc(msg)+'</div>'
    + (lines.length?'<div class="ov-sub">'+lines.map(function(l){return esc(l);}).join('<br>')+'</div>':'')
    + '<div class="ov-actions"><button class="btn insp" id="ov-ok">확인</button></div>';
  document.getElementById('overlay').classList.add('on');
  var ok=document.getElementById('ov-ok');
  ok.onclick=hideOverlay;
  ok.focus();
}

// ── 반려 후 폐기 (제출자 본인) ── 확인·진행·완료·오류 모두 같은 오버레이 카드 (브라우저 confirm 금지)
function showDiscardConfirm(){
  document.getElementById('ov-card').innerHTML='<div class="x-icon">!</div>'
    + '<div class="ov-msg">이 검수보고서를 폐기하시겠습니까?</div>'
    + '<div class="ov-sub">'+esc(FORM.docNo)+' · '+esc(FORM.nextSeq)+'회차</div>'
    + '<div class="ov-warn"><b>폐기 후에는 복구할 수 없습니다.</b>'
    +   '<div>· 첨부한 검수 사진도 함께 휴지통으로 이동됩니다.</div>'
    +   '<div>· 이 회차 번호는 다시 쓰지 않습니다. 검수보고서가 다시 필요하면 다음 회차로 새로 제출해 주세요.</div>'
    + '</div>'
    + '<div class="ov-actions"><button class="btn gray" id="dc-cancel">취소</button>'
    + '<button class="btn danger-fill" id="dc-ok">폐기 확인</button></div>';
  document.getElementById('overlay').classList.add('on');
  document.getElementById('dc-cancel').onclick=hideOverlay;
  document.getElementById('dc-ok').onclick=doDiscard;
  // 기본 포커스를 두지 않는다 — Enter 한 번에 폐기되지 않도록 (최종 확인 모달과 같은 원칙)
  if(document.activeElement) document.activeElement.blur();
}

function setActionButtonsDisabled(v){
  ['submit-btn','discard-btn'].forEach(function(id){ var b=document.getElementById(id); if(b) b.disabled=v; });
}

function doDiscard(){
  showOverlay('폐기 처리 중...', '잠시만 기다려 주세요.');
  setActionButtonsDisabled(true);
  google.script.run
    .withSuccessHandler(function(res){
      if(res&&res.ok){
        document.getElementById('ov-card').innerHTML='<div class="ok-icon">✓</div>'
          + '<div class="ov-msg">폐기 완료</div>'
          + '<div class="ov-sub">'+esc(FORM.docNo)+' 검수보고서가 폐기되었습니다.</div>'
          + '<button class="btn insp" style="margin-top:18px;" onclick="goHome()">홈으로 이동</button>';
      }else{
        setActionButtonsDisabled(false);
        showAlertModal('폐기에 실패했습니다.', res?res.message:'알 수 없는 오류');
      }
    })
    .withFailureHandler(function(err){
      setActionButtonsDisabled(false);
      showAlertModal('폐기에 실패했습니다.', '네트워크 오류: '+(err&&err.message?err.message:err));
    })
    .discardInspForClient({ token: RESUB_TOKEN, reason: '제출자 폐기 (반려 후)' });
}

function showOverlay(msg,sub){
  document.getElementById('ov-card').innerHTML='<div class="spinner"></div><div class="ov-msg">'+esc(msg)+'</div><div class="ov-sub">'+esc(sub||'')+'</div>';
  document.getElementById('overlay').classList.add('on');
}
function showSuccess(res){
  document.getElementById('ov-card').innerHTML=
    '<div class="ok-icon">✓</div>'
    + '<div class="ov-msg">제출 완료</div>'
    + '<div class="ov-sub">'+esc(res.docNo)+' · 1차 결재자에게 메일이 발송되었습니다.</div>'
    + '<button class="btn insp" style="margin-top:18px;" onclick="goHome()">홈으로 이동</button>';
}
function hideOverlay(){document.getElementById('overlay').classList.remove('on');}

boot();
</script>
</body>
</html>
